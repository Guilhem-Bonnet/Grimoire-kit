name: Regression test on base

# Une PR `fix:` doit apporter un test qui échoue sur son point de départ
# (scripts/check-regression-on-base.py). Les actions sont épinglées par SHA.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: "Replay regression test on base"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Replay PR tests on base_sha
        env:
          # Via l'environnement, jamais interpolé dans le script (injection).
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        # Le garde est lu depuis base.sha : une PR qui l'affaiblit ne peut pas
        # se faire valider par sa propre version. Absent de base.sha (PR qui
        # l'introduit), il n'y a rien à rejouer : sans ce test, `git show`
        # fait échouer le pas sous bash -e avant tout verdict.
        # La tête est vérifiée sur le commit de fusion (github.sha), celui que
        # actions/checkout extrait : une branche en retard sur main n'est pas
        # validée contre un code que main a déjà changé.
        run: |
          if ! git cat-file -e "$BASE_SHA:scripts/check-regression-on-base.py" 2>/dev/null; then
            echo "garde absent de base.sha (amorçage) : rejeu sans objet" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git show "$BASE_SHA:scripts/check-regression-on-base.py" > "$RUNNER_TEMP/guard.py"
          python "$RUNNER_TEMP/guard.py" --repo . \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --verify-sha "$MERGE_SHA"
