name: Grimoire Weekly Benchmark

on:
  # ── Planification hebdomadaire (chaque lundi à 6h UTC) ──────────────────────
  schedule:
    - cron: "0 6 * * 1"

  # ── Déclenchement manuel depuis GitHub UI ──────────────────────────────────
  workflow_dispatch:
    inputs:
      since:
        description: "Depuis (YYYY-MM-DD, laisser vide pour all-time)"
        required: false
        type: string
      agent:
        description: "Filtrer sur un agent spécifique (laisser vide pour tous)"
        required: false
        type: string

permissions:
  contents: write      # Pour pousser sur la branche bench-reports
  issues: write        # Pour créer une issue si dégradation critique

concurrency:
  group: weekly-bench
  cancel-in-progress: true

jobs:
  bench:
    name: "Grimoire Agent Benchmark"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Tout l'historique pour calculer cycle times

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install pyyaml

      # ── Reconstruire le TRACE ─────────────────────────────────────────────
      # Grimoire_TRACE.md est gitignoré (alimenté en local par le hook
      # post-commit) : un checkout CI ne peut pas l'avoir. Sans cette étape le
      # benchmark lisait un fichier absent et publiait chaque semaine un
      # rapport à zéro entrée conclu par « aucune anomalie détectée ».
      - name: Reconstruire Grimoire_TRACE depuis l'historique git
        run: |
          SINCE="${{ github.event.inputs.since || '' }}"
          ARGS="--branch ${GITHUB_REF_NAME} --min-entries 1"
          [[ -n "$SINCE" ]] && ARGS="$ARGS --since $SINCE"

          python3 scripts/trace-from-git.py $ARGS \
            --out _grimoire-output/Grimoire_TRACE.md

      # ── Générer le rapport ────────────────────────────────────────────────
      - name: Run agent-bench --report
        id: bench
        run: |
          SINCE="${{ github.event.inputs.since || '' }}"
          AGENT="${{ github.event.inputs.agent || '' }}"

          ARGS="--report"
          [[ -n "$SINCE" ]] && ARGS="$ARGS --since $SINCE"
          [[ -n "$AGENT" ]] && ARGS="$ARGS --agent $AGENT"

          mkdir -p _grimoire-output/bench-reports

          python3 framework/tools/agent-bench.py \
            $ARGS \
            --out _grimoire-output/bench-reports/latest.md \
            --trace _grimoire-output/Grimoire_TRACE.md \
            2>&1 | tee bench-output.txt

          # Un rapport sans entrée ne mesure rien — on échoue au lieu de
          # publier un vert qui n'en est pas un.
          ENTRIES=$(grep -oE "Entrées TRACE analysées : [0-9]+" \
            _grimoire-output/bench-reports/latest.md | grep -oE "[0-9]+$" || echo "0")
          if [[ "$ENTRIES" -eq 0 ]]; then
            echo "::error::Rapport vide — 0 entrée TRACE analysée. Rien n'est mesuré."
            exit 1
          fi

          # Copie historisée avec date
          DATE=$(date +%Y-%m-%d)
          cp _grimoire-output/bench-reports/latest.md "_grimoire-output/bench-reports/${DATE}.md"

          # Extraire le nombre de failures pour metric
          FAILURES=$(grep -oE "Total failures.*\| [0-9]+" _grimoire-output/bench-reports/latest.md | grep -oE "[0-9]+$" || echo "0")
          echo "failures=$FAILURES" >> $GITHUB_OUTPUT
          echo "report_date=$DATE" >> $GITHUB_OUTPUT

      # ── Publier dans GitHub Step Summary ─────────────────────────────────
      - name: Publish to Step Summary
        run: |
          echo "## 📊 Grimoire Agent Benchmark — ${{ steps.bench.outputs.report_date }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat _grimoire-output/bench-reports/latest.md >> $GITHUB_STEP_SUMMARY

      # ── Publier le rapport sur la branche bench-reports ────────────────────
      # main exige 14 checks obligatoires depuis le 2026-09-04 (GH006 sur tout
      # push direct) ; une PR ouverte par le GITHUB_TOKEN du workflow ne
      # déclenche pas ces checks (garde anti-récursion GitHub) et resterait
      # ouverte sans humain pour la fusionner — un rendez-vous manuel chaque
      # semaine. bench-reports est une branche dédiée, non protégée, jamais
      # fusionnée dans main : le push y est direct, sans PR ni CI à attendre.
      - name: Publier le rapport sur bench-reports
        run: |
          set -euo pipefail
          DATE="${{ steps.bench.outputs.report_date }}"

          git config user.name "Grimoire Bench Bot"
          git config user.email "grimoire-bench-bot@github-actions"

          # Le rapport généré vit dans le répertoire de travail (checkout de
          # GITHUB_REF_NAME) : on le met de côté avant de changer de branche.
          STAGING=$(mktemp -d)
          cp -r _grimoire-output/bench-reports/. "$STAGING/"

          if git ls-remote --exit-code --heads origin bench-reports >/dev/null 2>&1; then
            git fetch origin bench-reports
            git checkout -B bench-reports origin/bench-reports
          else
            git checkout -B bench-reports origin/main
          fi

          mkdir -p _grimoire-output/bench-reports
          cp -r "$STAGING/." _grimoire-output/bench-reports/

          git add _grimoire-output/bench-reports/
          if git diff --staged --quiet; then
            echo "Aucun changement à publier"
            exit 0
          fi
          git commit -m "chore(bench): rapport hebdomadaire ${DATE}"
          git push origin bench-reports

      # ── Alerte si trop de failures ────────────────────────────────────────
      - name: Alert on high failures
        if: ${{ steps.bench.outputs.failures != '' && fromJSON(steps.bench.outputs.failures) >= 10 }}
        uses: actions/github-script@v9
        with:
          script: |
            const failures = ${{ steps.bench.outputs.failures }};
            const date = '${{ steps.bench.outputs.report_date }}';

            // Vérifier si une issue est déjà ouverte pour ce bench
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'grimoire-bench-alert',
              state: 'open',
            });

            if (issues.data.length > 0) {
              console.log('Issue déjà ouverte — skip');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Grimoire Bench Alert — ${failures} failures détectés (${date})`,
              body: `## Alerte Benchmark Grimoire\n\n` +
                    `Le rapport hebdomadaire du ${date} détecte **${failures} failures**` +
                    ` dans Grimoire_TRACE.md, ce qui dépasse le seuil d'alerte (10).\n\n` +
                    `**Actions recommandées :**\n` +
                    `1. Consulter \`_grimoire-output/bench-reports/${date}.md\`\n` +
                    `2. Lancer \`bash grimoire-init.sh bench --improve\`\n` +
                    `3. Passer \`bench-context.md\` à Sentinel > \`bench-review\`\n\n` +
                    `---\n*Créée automatiquement par Grimoire Weekly Benchmark*`,
              labels: ['grimoire-bench-alert', 'agent-quality'],
            });

  # ── Sonde d'ancrage (#613) ─────────────────────────────────────────────
  # Sommet de la pyramide de gardes : une persona émise par le kit courant
  # reçoit deux questions dont toute réponse chiffrée est inventée (module
  # inexistant, API inexistante) ; le juge mécanique de evals/grounding-probe.py
  # échoue le job dès qu'un pourcentage, une note ou une quantité apparaît sans
  # source. La troisième question (note sur demande explicite) reste hors
  # gate : mesurée à 3/3 fabriquée sur haiku (evals/reports/2026-09-18-grounding-probe/).
  # Le job ne tourne que si ANTHROPIC_API_KEY est dans les secrets du dépôt —
  # sans clé il est sauté, jamais vert par défaut.
  grounding-probe:
    name: "Sonde d'ancrage (haiku, 2 questions × 3)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Clé API présente ?
        id: key
        run: |
          if [[ -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "::warning::ANTHROPIC_API_KEY absent des secrets — sonde d'ancrage sautée (pas un vert)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node (CLI claude)
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer le kit et le CLI claude
        if: steps.key.outputs.present == 'true'
        run: |
          pip install -e .
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Construire le témoin et le wrapper émis par ce kit
        if: steps.key.outputs.present == 'true'
        run: python evals/grounding-probe-witness.py --out _grimoire-output/grounding-probe

      - name: Sonder (bras after = wrapper du kit courant)
        if: steps.key.outputs.present == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          python evals/grounding-probe.py run \
            --project _grimoire-output/grounding-probe/projet \
            --wrapper _grimoire-output/grounding-probe/wrapper-after.md \
            --label after --reps 3 --model haiku \
            --only coverage-trend capacity-projection \
            --out "_grimoire-output/grounding-probe/runs/${DATE}"
          echo "runs=_grimoire-output/grounding-probe/runs/${DATE}" >> "$GITHUB_ENV"

      - name: Verdict (échec dès un chiffre inventé)
        if: steps.key.outputs.present == 'true'
        run: |
          {
            echo "## Sonde d'ancrage — $(date +%Y-%m-%d)"
            echo
            python evals/grounding-probe.py report "$runs"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python evals/grounding-probe.py report "$runs" --fail-on-fabrication after >/dev/null

      - name: Archiver les runs
        if: steps.key.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: grounding-probe-runs
          path: _grimoire-output/grounding-probe/runs/
          if-no-files-found: ignore
