name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 0" # Weekly Sunday 06:00 UTC

permissions:
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` (avant 2026-09-16) ajoute ~250 requêtes de
          # style/qualité (imports inutilisés, except vide, retours mixtes…)
          # déjà couvertes par le gate ruff/mypy de la CI — elles noyaient les
          # ~150 alertes de sécurité réelles sous le bruit, au point que plus
          # personne ne lisait le check CodeQL (épic #552). `security-extended`
          # garde toutes les requêtes de sécurité (py/path-injection,
          # py/log-injection, py/tarslip, py/command-line-injection…) sans la
          # partie qualité. Justification et inventaire complet du narrowing :
          # docs/security/code-scanning-triage-2026-09.md.
          queries: security-extended

      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          category: "/language:${{ matrix.language }}"
