name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  # Le brouillon se calcule depuis les étiquettes des PR fusionnées. Corriger
  # une étiquette ne le corrige donc pas : sans déclenchement manuel, il faut
  # attendre le prochain push sur main pour que la note reflète la correction,
  # et une note fausse reste publiable entre-temps.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
