name: Grimoire CI — Validate

on:
  push:
    branches: [main, "grimoire/**"]
    paths:
      - "archetypes/**"
      - "framework/**"
      - "tests/**"
      - "grimoire-init.sh"
      - ".github/workflows/ci-validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "archetypes/**"
      - "framework/**"
      - "tests/**"
      - "grimoire-init.sh"
      # Le filtre `push` incluait déjà ce fichier, pas celui-ci : une PR qui ne
      # modifiait que le workflow ne le déclenchait pas, donc se faisait relire
      # sans jamais s'exécuter. C'est la modification de CI qui a le plus besoin
      # d'être exercée avant d'atterrir.
      - ".github/workflows/ci-validate.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Syntaxe bash ─────────────────────────────────────────────────────────
  bash-syntax:
    name: "Bash syntax check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check grimoire-init.sh syntax
        run: bash -n grimoire-init.sh && echo "✅ grimoire-init.sh OK"

      - name: Check all hook scripts syntax
        run: |
          find framework/hooks -name "*.sh" | while read -r f; do
            bash -n "$f" && echo "✅ $f OK" || { echo "❌ $f FAIL"; exit 1; }
          done

  # ── 2. DNA Validation ─────────────────────────────────────────────────────
  dna-validate:
    name: "DNA validate --all"
    runs-on: ubuntu-latest
    needs: bash-syntax
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run validate --all
        run: bash grimoire-init.sh validate --all

      - name: Count DNA files
        run: |
          COUNT=$(find archetypes -name "*.dna.yaml" | wc -l)
          echo "DNA files found: $COUNT"
          echo "dna_count=$COUNT" >> $GITHUB_OUTPUT
        id: count

  # ── 3. ShellCheck ───────────────────────────────────────────────────────────
  shellcheck:
    name: "ShellCheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck on all shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: "."
          additional_files: "grimoire-init.sh"
          ignore_names: "*.zsh"
          ignore_paths: >-
            framework/hooks/post-checkout.sh
            framework/hooks/post-commit.sh
            _grimoire

  # ── 4. YAML lint ──────────────────────────────────────────────────────────
  yaml-lint:
    name: "YAML lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: relaxed
            rules:
              line-length:
                max: 120
          file_or_dir: |
            archetypes/
            framework/
          strict: false

  # ── 5. Doctor check ───────────────────────────────────────────────────────
  doctor:
    name: "Grimoire Doctor (sans Qdrant)"
    runs-on: ubuntu-latest
    needs: [bash-syntax, dna-validate]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Run doctor (skip Qdrant en CI)
        run: |
          # La vérif Qdrant va échouer gracieusement en CI — on filtre les erreurs Qdrant
          bash grimoire-init.sh doctor 2>&1 | tee doctor-output.txt || true
          # Vérifier qu'il n'y a pas d'erreurs críticas non-Qdrant
          CRIT=$(grep -c "✗\|FAIL\|ERROR" doctor-output.txt || true)
          QDRANT=$(grep -c "Qdrant\|qdrant" doctor-output.txt || true)
          # En CI, _grimoire/_config/ et _grimoire-output/ n'existent pas (repo SDK, pas projet initialisé)
          CI_EXPECTED=$(grep -c "_grimoire/_config/\|_grimoire-output/\|project-context.yaml" doctor-output.txt || true)
          REAL_ERRORS=$((CRIT - QDRANT - CI_EXPECTED))
          echo "Erreurs critiques (hors Qdrant, hors CI-expected) : $REAL_ERRORS"
          if [[ $REAL_ERRORS -gt 0 ]]; then
            echo "❌ Trop d'erreurs critiques détectées (hors Qdrant)"
            cat doctor-output.txt
            exit 1
          fi
          echo "✅ Doctor OK (hors connectivité Qdrant)"

  # ── 6. Context Budget Guard ───────────────────────────────────────────────
  context-guard:
    name: "Context Budget Guard"
    runs-on: ubuntu-latest
    needs: bash-syntax
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run context-guard (seuil alerte 40%, bloquant 70%)
        run: |
          set +e
          python3 framework/tools/context-guard.py \
            --project-root . \
            --threshold 40 \
            --json 2>&1 | tee guard-output.json
          GUARD_EXIT=${PIPESTATUS[0]}
          set -e
          if [[ "$GUARD_EXIT" -ge 2 ]]; then
            echo "❌ Context Guard CRITICAL — un agent dépasse 70% de la fenêtre"
            cat guard-output.json
            exit 2
          fi
          if [[ "$GUARD_EXIT" -eq 1 ]]; then
            echo "⚠️  Context Guard WARNING — certains agents approchent 40%"
          else
            echo "✅ Context Guard OK — tous les agents dans les limites"
          fi

      - name: Upload guard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: context-guard-report
          path: guard-output.json
          retention-days: 14

  # ── 7b. Framework Tools Tests (pytest) ────────────────────────────────────
  framework-tests:
    # Les 108 outils de framework/tools/ ne tournaient qu'en ubuntu : l'issue #33
    # a montré un `import fcntl` fatal découvert par un rapport utilisateur, pas
    # par la CI. Un outil livré sur les deux plateformes se teste sur les deux.
    name: "Framework Tools Tests (pytest, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: bash-syntax
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          # Windows rapporte sans bloquer, le temps que l'issue #192 soit
          # traitée : 45 des 108 outils impriment des caractères hors cp1252 et
          # meurent en `UnicodeEncodeError` sur une console Windows. C'est un
          # défaut de classe, pas un incident de ce lot — et le corriger demande
          # une passe sur les outils, pas sur la CI.
          #
          # `continue-on-error` n'est pas l'ancien `|| true` : l'échec reste
          # visible dans l'interface et dans le résumé, il ne se déguise pas en
          # succès. Il se retire dès que #192 est close, et ce job redevient
          # bloquant sur les deux plateformes.
          - os: windows-latest
            soft: true
    continue-on-error: ${{ matrix.soft == true }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      # `pytest pyyaml` seuls ne suffisaient pas : sept fichiers de
      # `tests/test_*.py` importent `typer` et un autre `ruamel.yaml`, tous deux
      # dépendances de base du paquet. Ils échouaient à la collecte, et le job
      # s'en déclarait vert. On installe donc ce que les tests supposent.
      - name: Install test deps
        run: pip install -e . pytest pyyaml

      - name: Run framework tests
        shell: bash
        run: |
          # Le code de sortie de pytest décide, pas la forme de sa dernière
          # ligne : l'ancienne version avalait l'échec avec `|| true` puis le
          # devinait au grep, donc une interruption ou un format inattendu
          # passait pour un succès.
          set -o pipefail
          rc=0
          python -m pytest tests/test_*.py -q --tb=short -x \
            --ignore=tests/test_background_tasks.py \
            2>&1 | tee framework-test-output.txt || rc=$?
          {
            echo "### 🔧 Framework Tests — ${{ matrix.os }}"
            tail -1 framework-test-output.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # ── 8. Résumé ─────────────────────────────────────────────────────────────
  summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs: [bash-syntax, dna-validate, shellcheck, yaml-lint, doctor, context-guard, framework-tests]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## Grimoire CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bash syntax | ${{ needs.bash-syntax.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DNA validate | ${{ needs.dna-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ShellCheck | ${{ needs.shellcheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| YAML lint | ${{ needs.yaml-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Doctor | ${{ needs.doctor.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Context Guard | ${{ needs.context-guard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Framework Tests | ${{ needs.framework-tests.result }} |" >> $GITHUB_STEP_SUMMARY
