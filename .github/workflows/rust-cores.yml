name: Rust cores

# Point d'entrée CI unique pour les cœurs Rust optionnels du kit
# (rust/grimoire-policies-core/, rust/grimoire-schema-core/,
# rust/grimoire-hosts-core/, rust/grimoire-flows-core/,
# rust/grimoire-dispatch-core/ et rust/grimoire-traces-core/, issue #354).
#
# Remplace rust-policies-core.yml et rust-schema-core.yml. Ces deux
# workflows étaient filtrés par `paths:` : invisibles de toute PR hors de
# leur périmètre, ils ne pouvaient donc pas devenir des checks requis de la
# protection de `main` sans bloquer ces PR-là (un check requis qui ne se
# déclare jamais fait échouer le merge). Résultat concret : #397 a fusionné
# avec `cargo fmt` rouge, sans qu'aucune protection ne s'y oppose.
#
# Ici le déclenchement couvre TOUTE PR vers main et TOUT push sur main, sans
# filtre `paths`. Un premier job `changes` calcule quel(s) crate(s) sont
# concernés (dorny/paths-filter, sur les mêmes listes de chemins que les
# anciens workflows) ; les douze jobs par crate (cargo + parity, un couple
# par crate) ne s'exécutent que si leur périmètre est touché et sont sinon
# rapportés `skipped` par GitHub — un skip satisfait un check requis, une
# absence de rapport ne le satisfait jamais. `rust-gate` est le seul job à
# déclarer comme check requis dans la protection de branche : il agrège les
# douze jobs et échoue si l'un d'eux a échoué ou a été annulé, réussit sinon
# (y compris quand tous ont été sautés).
#
# Ne touche à rien de ce que publish.yml construit ou publie : la wheel
# reste la wheel universelle actuelle tant que ces cœurs restent optionnels,
# et ce fichier ne déclare aucune dépendance vers publish.yml ni release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      policies: ${{ steps.filter.outputs.policies }}
      schema: ${{ steps.filter.outputs.schema }}
      hosts: ${{ steps.filter.outputs.hosts }}
      flows: ${{ steps.filter.outputs.flows }}
      dispatch: ${{ steps.filter.outputs.dispatch }}
      traces: ${{ steps.filter.outputs.traces }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            policies:
              - "rust/grimoire-policies-core/**"
              - "src/grimoire/policies/**"
              - "tests/unit/test_policies.py"
              - "tests/unit/test_policies_rust_parity.py"
              - "tests/unit/test_security_policies.py"
              - "pyproject.toml"
              - ".github/workflows/rust-cores.yml"
            schema:
              - "rust/grimoire-schema-core/**"
              - "src/grimoire/core/schema.py"
              - "src/grimoire/core/validator.py"
              - "tests/unit/core/test_schema.py"
              - "tests/unit/core/test_validator.py"
              - "tests/unit/test_schema_validator_rust_parity.py"
              - "pyproject.toml"
              - ".github/workflows/rust-cores.yml"
            flows:
              - "rust/grimoire-flows-core/**"
              - "src/grimoire/flows/**"
              - "src/grimoire/runtime/kernel.py"
              - "src/grimoire/runtime/schemas.py"
              - "tests/unit/test_flows_engine.py"
              - "tests/unit/test_runtime.py"
              - "tests/unit/test_flows_rust_parity.py"
              - "registry/blueprints/**"
              - "pyproject.toml"
              - ".github/workflows/rust-cores.yml"
            hosts:
              - "rust/grimoire-hosts-core/**"
              - "src/grimoire/hosts/collect.py"
              - "src/grimoire/hosts/surface.py"
              - "tests/unit/test_hosts.py"
              - "tests/unit/test_hosts_rust_parity.py"
              - "pyproject.toml"
              - ".github/workflows/rust-cores.yml"
            dispatch:
              - "rust/grimoire-dispatch-core/**"
              - "src/grimoire/missions/dispatch.py"
              - "src/grimoire/providers/**"
              - "src/grimoire/flows/dispatch_executor.py"
              - "tests/unit/missions/test_dispatch.py"
              - "tests/unit/missions/test_dispatch_history.py"
              - "tests/unit/missions/test_dispatch_agent_context.py"
              - "tests/unit/cli/test_cmd_task_dispatch.py"
              - "tests/unit/test_providers.py"
              - "tests/unit/cli/test_cmd_providers.py"
              - "tests/unit/test_flows_dispatch_executor.py"
              - "tests/unit/test_dispatch_rust_parity.py"
              - "tests/fixtures/dispatch_worker_outputs/**"
              - "pyproject.toml"
              - ".github/workflows/rust-cores.yml"
            traces:
              - "rust/grimoire-traces-core/**"
              - "src/grimoire/traces/ledger.py"
              - "src/grimoire/core/agent_freshness.py"
              - "src/grimoire/proposals.py"
              - "tests/unit/test_traces.py"
              - "tests/unit/test_proposals.py"
              - "tests/unit/test_workspace_proposals.py"
              - "tests/unit/test_traces_rust_parity.py"
              - "tests/e2e/test_workspace_proposals.py"
              - "tests/e2e/test_workspace_agent_freshness.py"
              - "tests/fixtures/traces_ledgers/**"
              - "pyproject.toml"
              - ".github/workflows/rust-cores.yml"

  rust-policies-cargo:
    name: "rust-policies / cargo"
    needs: changes
    if: needs.changes.outputs.policies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-policies-core -> target"

      - name: Format check
        run: cargo fmt --manifest-path rust/grimoire-policies-core/Cargo.toml --check

      - name: Unit tests
        # --no-default-features : la feature `extension-module` de PyO3 (par
        # défaut, requise pour que l'extension soit chargeable par Python)
        # empêche de lier le binaire de test — voir le commentaire en tête
        # de rust/grimoire-policies-core/Cargo.toml. La logique testée ici
        # (evaluate_core) ne touche à aucun type PyO3, donc aucun
        # interpréteur Python n'est nécessaire pour ce job.
        run: cargo test --no-default-features --manifest-path rust/grimoire-policies-core/Cargo.toml

  rust-policies-parity:
    name: "rust-policies / parity"
    needs: changes
    if: needs.changes.outputs.policies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-policies-core -> target"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Build and install the compiled core
        # `maturin develop` exige un virtualenv actif ; le runner utilise le
        # Python de l'image, sans venv. On construit donc la roue et on
        # l'installe, ce qui donne le même résultat sans cette contrainte.
        run: |
          pip install "maturin>=1.7,<2"
          maturin build --release --manifest-path rust/grimoire-policies-core/Cargo.toml --out dist-rust
          pip install --force-reinstall dist-rust/*.whl

      - name: Verify the compiled core is importable
        run: python -c "import grimoire_policies_core; print('grimoire_policies_core', grimoire_policies_core.__version__)"

      - name: Policy tests — contract unmodified, both backends, parity
        # tests/unit/test_policies.py est le contrat : il tourne tel quel ici
        # (module compilé présent) et dans le job SDK normal (absent) — voir
        # ci-sdk.yml. test_policies_rust_parity.py force chaque backend tour
        # à tour (GRIMOIRE_POLICIES_BACKEND) et compare les verdicts.
        run: pytest tests/unit/test_policies.py tests/unit/test_policies_rust_parity.py tests/unit/test_security_policies.py -q --tb=short

      - name: Full SDK suite with the compiled core loaded
        # Preuve que rien d'autre dans le kit ne dépend de l'absence du
        # module compilé (import optionnel, aucun autre appelant ne le
        # regarde) : la suite complète doit rester verte avec lui présent.
        run: pytest tests/unit/ tests/test_agentic_standard.py -q --tb=short -x

  rust-schema-cargo:
    name: "rust-schema / cargo"
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-schema-core -> target"

      - name: Format check
        run: cargo fmt --manifest-path rust/grimoire-schema-core/Cargo.toml --check

      - name: Unit tests
        # --no-default-features : la feature `extension-module` de PyO3 (par
        # défaut, requise pour que l'extension soit chargeable par Python)
        # empêche de lier le binaire de test — voir le commentaire en tête
        # de rust/grimoire-schema-core/Cargo.toml. La logique testée ici
        # (schema_core / validate_core) ne touche à aucun type PyO3, donc
        # aucun interpréteur Python n'est nécessaire pour ce job.
        run: cargo test --no-default-features --manifest-path rust/grimoire-schema-core/Cargo.toml

  rust-schema-parity:
    name: "rust-schema / parity"
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-schema-core -> target"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Build and install the compiled core
        # `maturin develop` exige un virtualenv actif ; le runner utilise le
        # Python de l'image, sans venv. On construit donc la roue et on
        # l'installe, ce qui donne le même résultat sans cette contrainte
        # (piège déjà rencontré et documenté sur le job policies).
        run: |
          pip install "maturin>=1.7,<2"
          maturin build --release --manifest-path rust/grimoire-schema-core/Cargo.toml --out dist-rust
          pip install --force-reinstall dist-rust/*.whl

      - name: Verify the compiled core is importable
        run: python -c "import grimoire_schema_core; print('grimoire_schema_core', grimoire_schema_core.__version__)"

      - name: Schema/validator tests — contract unmodified, both backends, parity
        # tests/unit/core/test_schema.py et tests/unit/core/test_validator.py
        # sont le contrat : ils tournent tels quels ici (module compilé
        # présent) et dans le job SDK normal (absent) — voir ci-sdk.yml.
        # test_schema_validator_rust_parity.py force chaque backend tour à
        # tour (GRIMOIRE_SCHEMA_BACKEND) et compare schémas/verdicts, y
        # compris sur des entrées malformées que le validateur Python de
        # référence rejette mal (plantage) ou pas du tout (accepte à tort).
        run: pytest tests/unit/core/test_schema.py tests/unit/core/test_validator.py tests/unit/test_schema_validator_rust_parity.py -q --tb=short

      - name: Full SDK suite with the compiled core loaded
        # Preuve que rien d'autre dans le kit ne dépend de l'absence du
        # module compilé (import optionnel, aucun autre appelant ne le
        # regarde) : la suite complète doit rester verte avec lui présent.
        run: pytest tests/unit/ tests/test_agentic_standard.py -q --tb=short -x

  rust-hosts-cargo:
    name: "rust-hosts / cargo"
    needs: changes
    if: needs.changes.outputs.hosts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-hosts-core -> target"

      - name: Format check
        run: cargo fmt --manifest-path rust/grimoire-hosts-core/Cargo.toml --check

      - name: Unit tests
        # --no-default-features : la feature `extension-module` de PyO3 (par
        # défaut, requise pour que l'extension soit chargeable par Python)
        # empêche de lier le binaire de test — voir le commentaire en tête
        # de rust/grimoire-hosts-core/Cargo.toml. La logique testée ici
        # (parse_frontmatter_core, tool_verbs_core, etc.) ne touche à aucun
        # type PyO3 — seul `yaml-rust2` est requis, aucun interpréteur
        # Python n'est nécessaire pour ce job.
        run: cargo test --no-default-features --manifest-path rust/grimoire-hosts-core/Cargo.toml

  rust-hosts-parity:
    name: "rust-hosts / parity"
    needs: changes
    if: needs.changes.outputs.hosts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-hosts-core -> target"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Build and install the compiled core
        # `maturin develop` exige un virtualenv actif ; le runner utilise le
        # Python de l'image, sans venv. On construit donc la roue et on
        # l'installe, ce qui donne le même résultat sans cette contrainte
        # (piège déjà rencontré et documenté sur les jobs policies/schema).
        run: |
          pip install "maturin>=1.7,<2"
          maturin build --release --manifest-path rust/grimoire-hosts-core/Cargo.toml --out dist-rust
          pip install --force-reinstall dist-rust/*.whl

      - name: Verify the compiled core is importable
        run: python -c "import grimoire_hosts_core; print('grimoire_hosts_core', grimoire_hosts_core.__version__)"

      - name: Hosts tests — contract unmodified, both backends, parity
        # tests/unit/test_hosts.py est le contrat : il tourne tel quel ici
        # (module compilé présent) et dans le job SDK normal (absent) — voir
        # ci-sdk.yml. test_hosts_rust_parity.py force chaque backend tour à
        # tour (GRIMOIRE_HOSTS_BACKEND) et compare frontmatter/faisceau/notes,
        # y compris sur le cas qui plantait le validateur Python de référence
        # (_max_turns sur un chiffre Unicode non-ASCII, corrigé dans cette PR).
        run: pytest tests/unit/test_hosts.py tests/unit/test_hosts_rust_parity.py -q --tb=short

      - name: Full SDK suite with the compiled core loaded
        # Preuve que rien d'autre dans le kit ne dépend de l'absence du
        # module compilé (import optionnel, aucun autre appelant ne le
        # regarde) : la suite complète doit rester verte avec lui présent.
        run: pytest tests/unit/ tests/test_agentic_standard.py -q --tb=short -x

  rust-flows-cargo:
    name: "rust-flows / cargo"
    needs: changes
    if: needs.changes.outputs.flows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-flows-core -> target"

      - name: Format check
        run: cargo fmt --manifest-path rust/grimoire-flows-core/Cargo.toml --check

      - name: Unit tests
        # --no-default-features : la feature `extension-module` de PyO3 (par
        # défaut, requise pour que l'extension soit chargeable par Python)
        # empêche de lier le binaire de test — voir le commentaire en tête
        # de rust/grimoire-flows-core/Cargo.toml. La logique testée ici
        # (is_flow_terminal, allowed_transitions, current_node_core,
        # check_output_against_contract_core, ...) ne touche à aucun type
        # PyO3, aucun interpréteur Python n'est nécessaire pour ce job.
        run: cargo test --no-default-features --manifest-path rust/grimoire-flows-core/Cargo.toml

  rust-flows-parity:
    name: "rust-flows / parity"
    needs: changes
    if: needs.changes.outputs.flows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-flows-core -> target"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Build and install the compiled core
        # `maturin develop` exige un virtualenv actif ; le runner utilise le
        # Python de l'image, sans venv. On construit donc la roue et on
        # l'installe, ce qui donne le même résultat sans cette contrainte
        # (piège déjà rencontré et documenté sur les jobs policies/schema/hosts).
        run: |
          pip install "maturin>=1.7,<2"
          maturin build --release --manifest-path rust/grimoire-flows-core/Cargo.toml --out dist-rust
          pip install --force-reinstall dist-rust/*.whl

      - name: Verify the compiled core is importable
        run: python -c "import grimoire_flows_core; print('grimoire_flows_core', grimoire_flows_core.__version__)"

      - name: Flows/kernel tests — contract unmodified, both backends, parity
        # tests/unit/test_flows_engine.py et tests/unit/test_runtime.py sont
        # le contrat : ils tournent tels quels ici (module compilé présent)
        # et dans le job SDK normal (absent) — voir ci-sdk.yml.
        # test_flows_rust_parity.py force chaque backend tour à tour
        # (GRIMOIRE_FLOWS_BACKEND), compare la grille de transitions
        # complète, et rejoue le corpus de blueprints livrés
        # (registry/blueprints/*.blueprint.json) sur les deux backends —
        # y compris le cas qui affichait un run REFUSED comme s'il
        # continuait de progresser (corrigé dans cette PR).
        run: pytest tests/unit/test_flows_engine.py tests/unit/test_runtime.py tests/unit/test_flows_rust_parity.py -q --tb=short

      - name: Full SDK suite with the compiled core loaded
        # Preuve que rien d'autre dans le kit ne dépend de l'absence du
        # module compilé (import optionnel, aucun autre appelant ne le
        # regarde) : la suite complète doit rester verte avec lui présent.
        run: pytest tests/unit/ tests/test_agentic_standard.py -q --tb=short -x

  rust-dispatch-cargo:
    name: "rust-dispatch / cargo"
    needs: changes
    if: needs.changes.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-dispatch-core -> target"

      - name: Format check
        run: cargo fmt --manifest-path rust/grimoire-dispatch-core/Cargo.toml --check

      - name: Unit tests
        # --no-default-features : la feature `extension-module` de PyO3 (par
        # défaut, requise pour que l'extension soit chargeable par Python)
        # empêche de lier le binaire de test — voir le commentaire en tête
        # de rust/grimoire-dispatch-core/Cargo.toml. La logique testée ici
        # (chaîne de paliers, rendu d'invocation, analyseur JSON maison,
        # extraction de coût/incertitudes, glob de revue, routage de
        # fournisseurs, verdict de cascade) ne touche à aucun type PyO3,
        # aucun interpréteur Python n'est nécessaire pour ce job.
        run: cargo test --no-default-features --manifest-path rust/grimoire-dispatch-core/Cargo.toml

  rust-dispatch-parity:
    name: "rust-dispatch / parity"
    needs: changes
    if: needs.changes.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-dispatch-core -> target"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Build and install the compiled core
        # `maturin develop` exige un virtualenv actif ; le runner utilise le
        # Python de l'image, sans venv. On construit donc la roue et on
        # l'installe, ce qui donne le même résultat sans cette contrainte
        # (piège déjà rencontré et documenté sur les jobs
        # policies/schema/hosts/flows).
        run: |
          pip install "maturin>=1.7,<2"
          maturin build --release --manifest-path rust/grimoire-dispatch-core/Cargo.toml --out dist-rust
          pip install --force-reinstall dist-rust/*.whl

      - name: Verify the compiled core is importable
        run: python -c "import grimoire_dispatch_core; print('grimoire_dispatch_core', grimoire_dispatch_core.__version__)"

      - name: Dispatch/routing tests — contract unmodified, both backends, parity
        # tests/unit/missions/test_dispatch.py et tests/unit/test_providers.py
        # (parmi d'autres) sont le contrat : ils tournent tels quels ici
        # (module compilé présent) et dans le job SDK normal (absent) — voir
        # ci-sdk.yml. test_dispatch_rust_parity.py force chaque backend tour
        # à tour (GRIMOIRE_DISPATCH_BACKEND), rejoue le corpus de sorties
        # d'ouvrier fixture et un fuzz léger, et compare le routage de
        # fournisseurs avec refroidissement — y compris les deux défauts
        # trouvés et corrigés dans cette PR (coût JSON booléen coercé en
        # 1.0/0.0, coût JSON non fini NaN/Infinity accepté tel quel).
        run: |
          pytest tests/unit/missions/test_dispatch.py tests/unit/missions/test_dispatch_history.py \
            tests/unit/missions/test_dispatch_agent_context.py tests/unit/cli/test_cmd_task_dispatch.py \
            tests/unit/test_providers.py tests/unit/cli/test_cmd_providers.py \
            tests/unit/test_flows_dispatch_executor.py tests/unit/test_dispatch_rust_parity.py \
            -q --tb=short

      - name: Full SDK suite with the compiled core loaded
        # Preuve que rien d'autre dans le kit ne dépend de l'absence du
        # module compilé (import optionnel, aucun autre appelant ne le
        # regarde) : la suite complète doit rester verte avec lui présent.
        run: pytest tests/unit/ tests/test_agentic_standard.py -q --tb=short -x

  rust-traces-cargo:
    name: "rust-traces / cargo"
    needs: changes
    if: needs.changes.outputs.traces == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-traces-core -> target"

      - name: Format check
        run: cargo fmt --manifest-path rust/grimoire-traces-core/Cargo.toml --check

      - name: Unit tests
        # --no-default-features : la feature `extension-module` de PyO3 (par
        # défaut, requise pour que l'extension soit chargeable par Python)
        # empêche de lier le binaire de test — voir le commentaire en tête
        # de rust/grimoire-traces-core/Cargo.toml. La logique testée ici
        # (agrégations du journal, règle de fraîcheur, nommage mécanique,
        # résolution du porteur, décision de synchronisation) ne touche à
        # aucun type PyO3, aucun interpréteur Python n'est nécessaire pour
        # ce job.
        run: cargo test --no-default-features --manifest-path rust/grimoire-traces-core/Cargo.toml

  rust-traces-parity:
    name: "rust-traces / parity"
    needs: changes
    if: needs.changes.outputs.traces == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/grimoire-traces-core -> target"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Build and install the compiled core
        # `maturin develop` exige un virtualenv actif ; le runner utilise le
        # Python de l'image, sans venv. On construit donc la roue et on
        # l'installe, ce qui donne le même résultat sans cette contrainte
        # (piège déjà rencontré et documenté sur les jobs
        # policies/schema/hosts/flows/dispatch).
        run: |
          pip install "maturin>=1.7,<2"
          maturin build --release --manifest-path rust/grimoire-traces-core/Cargo.toml --out dist-rust
          pip install --force-reinstall dist-rust/*.whl

      - name: Verify the compiled core is importable
        run: python -c "import grimoire_traces_core; print('grimoire_traces_core', grimoire_traces_core.__version__)"

      - name: Traces/proposals tests — contract unmodified, both backends, parity
        # tests/unit/test_traces.py, tests/unit/test_proposals.py et
        # tests/unit/test_workspace_proposals.py sont le contrat : ils
        # tournent tels quels ici (module compilé présent) et dans le job
        # SDK normal (absent) — voir ci-sdk.yml.
        # test_traces_rust_parity.py force chaque backend tour à tour
        # (GRIMOIRE_TRACES_BACKEND), rejoue le corpus de dix journaux JSONL
        # fixture et un fuzz léger, et vérifie les invariants de la doctrine
        # (seuil jamais sous 2, refus sticky jusqu'au doublement, persona
        # d'entrée jamais porteuse, match par mot entier) — y compris le
        # défaut trouvé et corrigé dans cette PR (horodatage ISO sans
        # décalage : `TypeError` non rattrapée à la soustraction, corrigée
        # dans `grimoire.traces.ledger._parse_iso`).
        run: |
          pytest tests/unit/test_traces.py tests/unit/test_proposals.py \
            tests/unit/test_workspace_proposals.py tests/unit/test_traces_rust_parity.py \
            -q --tb=short

      - name: Full SDK suite with the compiled core loaded
        # Preuve que rien d'autre dans le kit ne dépend de l'absence du
        # module compilé (import optionnel, aucun autre appelant ne le
        # regarde) : la suite complète doit rester verte avec lui présent.
        run: pytest tests/unit/ tests/test_agentic_standard.py -q --tb=short -x

  rust-gate:
    name: rust-gate
    if: always()
    needs:
      - changes
      - rust-policies-cargo
      - rust-policies-parity
      - rust-schema-cargo
      - rust-schema-parity
      - rust-hosts-cargo
      - rust-hosts-parity
      - rust-flows-cargo
      - rust-flows-parity
      - rust-dispatch-cargo
      - rust-dispatch-parity
      - rust-traces-cargo
      - rust-traces-parity
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the twelve Rust jobs
        # Seul ce job est déclaré comme check requis dans la protection de
        # main. Un job sauté (crate hors périmètre de la PR) est un succès
        # pour ce gate ; seuls `failure` et `cancelled` le font échouer.
        run: |
          set -eu
          declare -A results=(
            ["rust-policies / cargo"]="${{ needs.rust-policies-cargo.result }}"
            ["rust-policies / parity"]="${{ needs.rust-policies-parity.result }}"
            ["rust-schema / cargo"]="${{ needs.rust-schema-cargo.result }}"
            ["rust-hosts / cargo"]="${{ needs.rust-hosts-cargo.result }}"
            ["rust-hosts / parity"]="${{ needs.rust-hosts-parity.result }}"
            ["rust-schema / parity"]="${{ needs.rust-schema-parity.result }}"
            ["rust-flows / cargo"]="${{ needs.rust-flows-cargo.result }}"
            ["rust-flows / parity"]="${{ needs.rust-flows-parity.result }}"
            ["rust-dispatch / cargo"]="${{ needs.rust-dispatch-cargo.result }}"
            ["rust-dispatch / parity"]="${{ needs.rust-dispatch-parity.result }}"
            ["rust-traces / cargo"]="${{ needs.rust-traces-cargo.result }}"
            ["rust-traces / parity"]="${{ needs.rust-traces-parity.result }}"
          )
          failed=0
          for name in "${!results[@]}"; do
            status="${results[$name]}"
            echo "$name: $status"
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "Au moins un job Rust a échoué ou a été annulé." >&2
            exit 1
          fi
          echo "Tous les jobs Rust ont réussi ou ont été sautés (hors périmètre)."
