name: Deploy site

# Publie un seul artefact Pages composé de deux surfaces :
#   /            → web/ : seulement index.html, workspace/ et leurs ressources
#                  (media/, fonts/, teaser/) ; les pages de l'ancien atelier
#                  restent dans le dépôt (le paquet les embarque) mais ne sont
#                  pas publiées
#   /docs/       → site/ (manuel construit par mkdocs, --strict)
#
# Avant, seul web/ était publié : `mkdocs build` tournait en CI mais son
# résultat n'était déployé nulle part, et la page Documentation re-rendait
# docs/*.md côté client depuis raw.githubusercontent. Le manuel n'avait donc
# ni index de recherche, ni validation de liens au build, ni ancres stables.
#
# Le build tourne aussi sur pull request : c'est là que la porte doit pouvoir
# échouer. La construire seulement au push sur main la rendrait décorative —
# on constaterait la casse après le merge.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# GitHub Actions ne résout pas les ancres YAML : les deux listes de chemins
# sont volontairement dupliquées, elles doivent rester identiques.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs_hooks/**"
      - "src/**"
      - "scripts/gen-site-data.py"
      - "scripts/render-vitrine.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "web/**"
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs_hooks/**"
      - "src/**"
      - "scripts/gen-site-data.py"
      - "scripts/render-vitrine.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      # --strict : un lien interne cassé ou une page hors nav échoue le build.
      # C'est la seule barrière qui empêche le manuel de pourrir en silence.
      - name: Build manual
        run: python -m mkdocs build --strict --site-dir site

      # Le runner est neuf à chaque exécution : pas de nettoyage préalable.
      - name: Compose Pages artifact
        run: |
          mkdir -p _site
          # Liste blanche : une page de web/ n'est publiée que si elle est ici.
          cp web/index.html _site/
          cp -r web/workspace web/media web/fonts _site/
          if [ -d web/teaser ]; then cp -r web/teaser _site/; fi
          test ! -e _site/docs || (echo "web/docs entrerait en collision avec le manuel" && exit 1)
          cp -r site _site/docs
          # Chiffres de la vitrine : calculés ici depuis le dépôt, jamais saisis.
          # web/index.html ne porte que des attributs data-source ; sans valeur
          # calculable, la page n'affiche pas de chiffre (render-vitrine.py).
          python scripts/gen-site-data.py --root . --meta-only --out-dir _site/data
          python scripts/render-vitrine.py --meta _site/data/meta.json --html web/index.html --out _site/index.html
          test -f _site/index.html
          test -f _site/docs/index.html
          test -f _site/docs/search/search_index.json

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: _site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
