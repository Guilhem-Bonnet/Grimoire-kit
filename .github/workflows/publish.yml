name: Publish

# Voie unique de release (D-01). Ce workflow est le seul à créer la release
# GitHub : il n'existe plus de second workflow sur le même tag, donc plus de
# course entre deux créateurs ni de notes réécrites par l'un ou l'autre.
#
#   gates ─► build ─► test ─► publish-pypi ─► github-release
#
# * `gates` porte les garde-fous qui vivaient dans l'ancien release.yml, et en
#   ajoute un : le tag doit pointer un commit de main.
# * PyPI part sur un tag stable (vX.Y.Z). Une pré-version (vX.Y.Z-rc1, avec
#   `version.txt` et `__version__` à 3.63.0-rc1 : tests/unit/test_version_sync.py
#   et scripts/check-release-tag.py partagent la même graphie) ne
#   produit qu'une release GitHub marquée pre-release : `publish-pypi` est
#   alors ignoré, et `github-release` tourne quand même.
# * `github-release` passe après la publication : aucune release n'annonce un
#   paquet que PyPI n'a pas reçu. Son corps est la section du CHANGELOG
#   validée par `gates`, tel quel (scripts/changelog-section.py).

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

jobs:
  gates:
    name: "Garde-fous du tag"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # le tag doit être atteignable depuis origin/main ; le CHANGELOG se confronte à git

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      # Le tag et version.txt disent la même chose, et le tag est sur main.
      - name: Le tag est publiable
        id: tag
        run: python scripts/check-release-tag.py --tag "${GITHUB_REF_NAME}" --github-output "$GITHUB_OUTPUT"

      - name: Validate DNA avant release
        run: bash grimoire-init.sh validate --all

      # Sans le catalogue à jour, `grimoire migrate` gèle hors des mises à jour
      # chaque fichier introduit, chez tous les projets installés — le dégât
      # n'apparaît que des mois plus tard.
      - name: Le catalogue couvre les fichiers livrés
        run: python scripts/gen-kit-hashes.py --check

      - name: Le CHANGELOG décrit la version publiée
        run: python scripts/check-changelog-release.py

      - name: La section du CHANGELOG existe et n'est pas vide
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: python scripts/changelog-section.py "$VERSION" > /dev/null

  build:
    name: "Build package"
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify wheel installs
        run: |
          pip install dist/*.whl
          grimoire --version

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          mkdir -p sbom
          cyclonedx-py environment --output-format json -o sbom/sbom.cdx.json
          echo "SBOM generated: sbom/sbom.cdx.json"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom
          path: sbom/

  # La pré-vérification avant publication, c'est ce job : la wheel construite
  # est installée dans un runner neuf, sur chaque Python supporté, et doit
  # démarrer. Il n'y a pas d'étage TestPyPI — il n'a jamais tourné (le projet
  # n'y a jamais été enregistré, #195) et affichait une vérification qui
  # n'avait pas lieu. En local, avant le tag : `make wheel-check`.
  test:
    name: "Smoke test"
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/

      - name: Install and test
        run: |
          pip install dist/*.whl
          grimoire --version
          python -c "from grimoire.core.config import GrimoireConfig; print('SDK OK')"

  publish-pypi:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    # PyPI part sur un tag stable. Une pré-version n'y va pas : le numéro d'une
    # publication PyPI est consommé pour toujours.
    if: ${{ needs.gates.outputs.stable == 'true' }}
    needs: [gates, build, test]
    environment: pypi
    permissions:
      id-token: write  # Trusted Publisher
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/

      # `skip-existing` : un téléversement interrompu entre le sdist et la wheel
      # se relance sans échouer sur le fichier déjà reçu ; sinon `github-release`
      # (qui dépend de ce job) ne se créerait jamais, et il n'y a plus d'autre
      # workflow pour le rattraper.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true

  # Seul créateur de la release GitHub. `if` explicite : sans fonction de
  # statut, GitHub ignorerait ce job dès que `publish-pypi` l'est (pré-version).
  # Il tourne si tout ce qui précède a réussi, `publish-pypi` compris sur un
  # tag stable, et il est toléré ignoré sur une pré-version seulement.
  github-release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: [gates, build, test, publish-pypi]
    if: >-
      ${{ !cancelled()
      && needs.gates.result == 'success'
      && needs.build.result == 'success'
      && needs.test.result == 'success'
      && (needs.publish-pypi.result == 'success'
      || (needs.gates.outputs.stable != 'true' && needs.publish-pypi.result == 'skipped')) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: sbom
          path: sbom/

      - name: Notes de version = section du CHANGELOG
        env:
          VERSION: ${{ needs.gates.outputs.version }}
        run: python scripts/changelog-section.py "$VERSION" --output RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.gates.outputs.stable != 'true' }}
          # Le corps est la section du CHANGELOG, rien d'autre : pas de notes
          # générées qui s'y ajouteraient.
          generate_release_notes: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom/sbom.cdx.json
            grimoire-init.sh
            framework/archetype-dna.schema.yaml
