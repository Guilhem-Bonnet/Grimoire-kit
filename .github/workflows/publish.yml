name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: "Build package"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify wheel installs
        run: |
          pip install dist/*.whl
          grimoire --version

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          mkdir -p sbom
          cyclonedx-py environment --output-format json -o sbom/sbom.cdx.json
          echo "SBOM generated: sbom/sbom.cdx.json"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/

  # La pré-vérification avant publication, c'est ce job : la wheel construite
  # est installée dans un runner neuf, sur chaque Python supporté, et doit
  # démarrer. Il n'y a pas d'étage TestPyPI — il n'a jamais tourné (le projet
  # n'y a jamais été enregistré, #195) et affichait une vérification qui
  # n'avait pas lieu. En local, avant le tag : `make wheel-check`.
  test:
    name: "Smoke test"
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install and test
        run: |
          pip install dist/*.whl
          grimoire --version
          python -c "from grimoire.core.config import GrimoireConfig; print('SDK OK')"

  publish-pypi:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    # PyPI publishing is opt-in: set repo variable GRIMOIRE_ENABLE_PYPI=true to enable.
    # Disabled by default so a release tag produces a GitHub Release only (release.yml).
    if: ${{ vars.GRIMOIRE_ENABLE_PYPI == 'true' }}
    needs: [build, test]
    environment: pypi
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "$TAG" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline --no-merges "${PREV_TAG}..${TAG}")
          else
            NOTES=$(git log --oneline --no-merges -20)
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## Changes

            ${{ steps.notes.outputs.notes }}

            ## Installation

            ```bash
            pip install grimoire-kit==${GITHUB_REF_NAME#v}
            ```
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom/sbom.cdx.json
          generate_release_notes: true
