name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets with gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned release, sha256 verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # `fetch-depth: 0` récupère toutes les branches et tous les tags d'origin ; sans
      # `--log-opts`, gitleaks scannerait aussi les refs tierces et le verdict d'une PR
      # dépendrait de branches qui n'ont rien à voir avec le commit testé.
      # HEAD = le commit de fusion de la PR, ou main sur un push : tout l'historique de HEAD.
      - name: Scan the whole history of HEAD
        run: gitleaks git --config .gitleaks.toml --log-opts=HEAD --redact --no-banner --exit-code 1 .

      # Les tests qui exécutent gitleaks (exemption par chemin, plage scannée) sont sautés
      # ailleurs faute de binaire : ici il est installé, son absence fait échouer la suite.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Run the gitleaks behaviour tests
        env:
          GRIMOIRE_REQUIRE_GITLEAKS: "1"
        run: |
          pip install pytest==9.1.1 PyYAML==6.0.3
          python -m pytest --noconftest -p no:cacheprovider tests/unit/test_secret_scan.py

  audit-workflows:
    name: Audit workflow permissions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install PyYAML==6.0.3

      - name: Audit workflow permissions
        run: python scripts/ci/audit-workflow-permissions.py .github/workflows
