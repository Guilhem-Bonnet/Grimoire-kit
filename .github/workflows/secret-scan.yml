name: Secret Scan

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "*.py"
      - "*.toml"
      - "*.txt"
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Scan for secrets with gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "detect --source . --exit-code 1"

  audit-workflows:
    name: Audit workflow permissions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install PyYAML

      - name: Audit workflow permissions
        run: python scripts/ci/audit-workflow-permissions.py .github/workflows
