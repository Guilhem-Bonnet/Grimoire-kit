name: Grimoire SDK CI

on:
  push:
    branches: [main, "grimoire/**"]
    paths:
      - "src/**"
      - "tests/unit/**"
      - "tests/integration/**"
      - "tests/test_agentic_standard.py"
      - "pyproject.toml"
      # Gouvernent le garde d'épinglage des actions : modifier un workflow ou
      # le garde doit relancer le job qui l'exécute.
      - ".github/workflows/**"
      - "scripts/check-*.py"
      # Lus par les gardes du dépôt (`grimoire gates repo`) : les modifier sans
      # relancer le job qui les juge rendrait la garde décorative.
      - "docs/**"
      - "README.md"
      - "README.fr.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".pre-commit-config.yaml"
      # Lus par tests/unit/test_evals_collect.py : une PR evals-only qui
      # modifie les suites doit exécuter le SDK CI (cf. main rouge du
      # 2026-07-13 — la #71 path-filtrée n'avait jamais lancé ces tests).
      - "evals/tasks/**"
      - "evals/collect.py"
      # Budget de cérémonie (W6-01) : un budget modifié doit être revérifié.
      - "evals/ceremony-budget.yaml"
      # Gouvernent le job dep-audit : sans eux dans le filtre, ajouter un
      # waiver ou en laisser expirer un ne relance jamais l'audit qu'ils
      # pilotent — le controle serait modifie sans etre reverifie.
      - ".github/security/**"
      - "scripts/depaudit-waivers.py"
      # Lus par tests/test_agentic_standard.py : une PR YAML-only sur le
      # standard doit exécuter les tests d'intégrité référentielle, sinon ils
      # sont inertes exactement sur les PR qu'ils doivent garder.
      - "framework/agentic-standard/**"
  pull_request:
    branches: [main]
    # `edited` : la garde `changelog` juge le titre de la PR (celui que le
    # squash-merge conserve) ; le renommer doit relancer le job qui le lit.
    types: [opened, synchronize, reopened, edited]
  # Windows et macOS ne passent la suite complète que sur main, la nuit et à la
  # demande (2026-10-27) : sur une PR, chaque réalignement relançait ~45 min de
  # Windows. Une régression propre à ces systèmes se voit au plus tard la nuit.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "Ruff lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Historique complet : la garde `changelog` lit la plage de commits
          # de la branche contre origin/main, un clone shallow la rendrait muette.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        # Pin to the version locked in uv.lock — an unpinned `pip install ruff`
        # floats to the latest release and silently changes lint behaviour
        # (e.g. 0.16 dropped S310 on literal https URLs, breaking existing
        # `# noqa: S310`). Keep in sync with the ruff version in uv.lock.
        run: pip install ruff==0.15.20 pyyaml

      - name: Install the CLI (core dependencies only)
        run: pip install -e .

      - name: Lint
        run: ruff check src/ tests/unit/ framework/memory/ --output-format=github

      # La MÊME commande que le hook pre-push de .pre-commit-config.yaml
      # (comparées par tests/unit/scripts/test_repo_gates.py) : cliquet de
      # taille, CHANGELOG, prose émise, waivers, actions épinglées par SHA,
      # tenets, audience et commandes citées de la documentation, chiffres de vitrine.
      - name: Repo gates
        run: grimoire gates repo

  typecheck:
    name: "mypy --strict"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Type check
        run: mypy --strict src/grimoire/

      - name: Type check (Windows, fsio)
        run: mypy --strict --platform win32 --follow-imports=silent src/grimoire/core/fsio.py

      # W6-01 : une route qui coûte plus que son budget, un seuil non recopié,
      # une tâche type qui change de route ou une calibration de plus de deux
      # versions mineures fait échouer la CI.
      - name: Ceremony budget
        run: grimoire ceremony budget --file evals/ceremony-budget.yaml

  dep-audit:
    name: "Dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + pip-audit
        run: |
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Audit dependencies
        shell: bash
        run: |
          pip freeze --exclude-editable | grep -v '^grimoire-kit==' > audit-requirements.txt
          # Waivers gouvernés (issue #20) : les entrées actives de
          # .github/security/dependency-waivers.yaml deviennent des --ignore-vuln ;
          # un waiver expiré disparaît et l'audit redevient strict.
          IGNORE_FLAGS="$(python scripts/depaudit-waivers.py)"
          pip-audit --strict --desc $IGNORE_FLAGS -r audit-requirements.txt

  test:
    name: "Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # Sans borne, un test qui se bloque sous Windows garde le job six heures
    # (défaut GitHub). Windows tenait 62-93 min tant que chaque `init -y` payait
    # ~43 s de sondes localhost sans réponse (#857) ; borné depuis, la jambe
    # est réarmée sur les PR. 120 min reste la borne de sécurité.
    # Ubuntu ~25 min : à 45, un pytest-xdist figé après la chute d'un worker (vu deux fois les 27-28/10) échoue vite
    # et le merger relance le job (CI3) au lieu d'attendre deux heures. Windows et macOS gardent 120.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 45 || 120 }}
    env:
      # Sur une PR, Windows et macOS rendent leur check requis sans lancer la suite
      # (le nom du job reste, la protection de main l'exige) ; ubuntu la lance toujours.
      FULL_SUITE: ${{ matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # Keep matrix lean: Windows/macOS only on 3.12
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Suite complète réservée à main, la nuit et la demande
        if: env.FULL_SUITE != 'true'
        shell: bash
        run: echo "Suite sautée sur PR pour ${{ matrix.os }}, elle tourne sur main, chaque nuit et à la demande."

      - if: env.FULL_SUITE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - if: env.FULL_SUITE == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + dev deps
        if: env.FULL_SUITE == 'true'
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        if: env.FULL_SUITE == 'true'
        # La suite complète sur les trois systèmes (D-10) : l'ancien sous-ensemble
        # Windows et le `-x` (arrêt au premier échec, aussi posé par `addopts`)
        # cachaient chaque défaut derrière le précédent. xdist (`-n auto`) paie
        # le surcoût ; `--maxfail` n'est volontairement pas posé. `--dist loadfile` :
        # la répartition par test (défaut) mélange les fichiers sur un même worker et
        # révèle des états partagés (21 échecs en `-n 8` contre 10 en série) ; par
        # fichier, on retrouve exactement l'ensemble des échecs de la série.
        shell: bash
        run: |
          # `--timeout-method=thread` : un worker xdist figé hors d'un point Python (fork() d'un processus multi-thread,
          # vu en 3.13 le 2026-10-28 : job bloqué une heure) ne reçoit jamais le SIGALRM de la méthode `signal` ; le fil
          # de garde, lui, vide les piles dans le journal et tue le worker, que xdist remplace : le test fautif est nommé.
          pytest tests/unit/ tests/test_agentic_standard.py -q --tb=short -n auto --dist loadfile \
            --timeout=300 --timeout-method=thread --durations=25 \
            --cov=src/grimoire \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Report
        if: always()
        shell: bash
        run: |
          echo "### Python ${{ matrix.python-version }} Tests" >> $GITHUB_STEP_SUMMARY
          echo "See the test step logs for the full result." >> $GITHUB_STEP_SUMMARY

  e2e:
    name: "E2E (chromium, ubuntu-latest)"
    runs-on: ubuntu-latest
    # ~16 min d'ordinaire ; sans borne, une installation figée tient 6 h.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps + Playwright
        timeout-minutes: 15
        run: |
          pip install -e ".[dev]" playwright
          playwright install --with-deps chromium

      - name: Run the workspace browser harness
        # Mode strict : un skip (Playwright, Chromium, `grimoire init` absents)
        # est un échec, pas un faux vert (tests/e2e/_strict.py).
        env:
          GRIMOIRE_E2E_STRICT: "1"
          # Carte 3D (P81) sous WebGL logiciel (SwiftShader) : la présentation d'une image occupe le fil
          # principal ; l'exigence produit reste 100 ms (défaut du test), la CI sans GPU en tolère 200.
          # 285 ms mesurées sur main le 2026-10-29 (runner sans GPU) : 200 ne tenait pas ; la CI vérifie que la
          # disposition quitte le fil principal, pas la vitesse de SwiftShader.
          GRIMOIRE_CARTE_MAX_LONGTASK_MS: "400"
          # Même cause pour la fluidité : 22 images/s mesurées sur main le 2026-10-28 (seuil local 30) ; la CI
          # vérifie que la rotation tourne, pas la cadence d'un GPU qu'elle n'a pas.
          GRIMOIRE_CARTE_MIN_FPS: "15"
          # Un test qui échoue y laisse la capture et le HTML de ses pages (tests/e2e/conftest.py).
          GRIMOIRE_E2E_FAILURE_DIR: e2e-failures
        run: pytest tests/e2e -q --tb=short

      - name: Upload e2e failure captures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: e2e-failures
          path: e2e-failures/
          if-no-files-found: ignore
          retention-days: 7

  neo4j-service:
    name: "Neo4j 5.26 (service)"
    # P15/P15b : la clé de projet et le rattrapage s'éprouvent sur une vraie base,
    # pas sur un pilote factice. Le service vit le temps du job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26.25
        env:
          NEO4J_AUTH: neo4j/ci-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps + Neo4j driver
        run: pip install -e ".[dev,neo4j]"

      - name: Neo4j project-key tests on the real service
        env:
          GRIMOIRE_TEST_NEO4J_URI: bolt://localhost:7687
          GRIMOIRE_TEST_NEO4J_PASSWORD: ci-password
          # Interdit au module de se sauter lui-même (variable renommée, extra absent).
          GRIMOIRE_REQUIRE_NEO4J: "1"
        run: pytest tests/integration/test_neo4j_project_key_service.py -q --tb=short -rs --junitxml=neo4j-service.xml

      - name: Fail when no test actually ran
        # Un job vert dont les tests sont tous ignorés ne prouve rien.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("neo4j-service.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"tests={tests} skipped={skipped}")
          assert tests >= 5 and skipped == 0, "le job Neo4j doit exécuter ses tests, aucun ignoré"
          PY

  surface-coverage:
    name: "Surface coverage ratchet"
    # Sur une PR seulement : le cliquet compare au point de départ (D-09). Il
    # nomme l'unité (sous-commande, hook, genre de flow, hôte) dont le dernier
    # test a disparu, là où `--cov-fail-under` ne voit qu'un pourcentage.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Registry guards and monotonic ratchet against the base
        env:
          # Par l'environnement, jamais interpolé dans le script (injection).
          BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/check-surface-coverage.py --check --base "$BASE_REF"

  build:
    name: "Build package"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, dep-audit, test, neo4j-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify wheel
        run: |
          pip install dist/*.whl
          grimoire --version

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/
          retention-days: 30
