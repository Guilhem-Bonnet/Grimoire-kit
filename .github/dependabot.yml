version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci):"
    # Les étapes de codeql-action (init, autobuild, analyze) doivent avoir la même version :
    # mises à jour séparément, CodeQL refuse la configuration (#953, #955, 2026-10-26).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
