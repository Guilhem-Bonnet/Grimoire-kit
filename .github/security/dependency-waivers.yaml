$schema: "grimoire-agentic-standard-waivers/v1"
metadata:
  project: "grimoire-kit"
  scope: "ci-sdk dependency audit (pip-audit)"
  policy: >-
    Chaque waiver est borne dans le temps (expires_at). Un waiver expire =
    scripts/depaudit-waivers.py cesse de l'emettre = le job dep-audit redevient
    strict et repasse rouge tant que le risque n'est pas re-evalue.
# DEPAUDIT-2026-001 (CVE-2025-3000, torch) : RESOLU le 2026-07-22.
# OSV GHSA-rrmf-rvhw-rf47 modifie le 2026-07-17 : fixed = 2.13.0, publie sur
# PyPI. Plancher torch>=2.13.0 ajoute aux extras qdrant/weaviate dans
# pyproject.toml — le waiver n'est plus necessaire.
# DEPAUDIT-2026-002/003/004 (chromadb) : les trois CVE publiees le 2026-08-2x
# visent le SERVEUR ChromaDB (isolation multi-tenant, provider RBAC, endpoint
# /api/v2/...). grimoire-kit instancie chromadb.PersistentClient : embarque,
# local, mono-tenant, sans serveur ni couche d'authentification. Aucune des
# trois surfaces d'attaque n'existe dans cet usage. Aucune version corrigee
# n'est publiee en amont (OSV, verifie le 2026-08-26, puis le 2026-09-04 :
# 0.6.3 et 1.5.9 sont toutes deux affectees) : monter de version ne resout
# rien et ajouterait CVE-2026-45829 (injection pre-authentification, 1.x
# seulement). Re-waiver du 2026-09-04 (#174) : bornes au 2027-02-28, a
# re-evaluer a cette date — ou avant, si OSV publie un correctif.
waivers:
  - waiver_id: "DEPAUDIT-2026-002"
    check_id: "pip-audit"
    vulnerability_id: "CVE-2026-45830"
    package: "chromadb"
    reason: >-
      Absence de validation d'autorisation entre tenants du serveur ChromaDB.
      grimoire-kit utilise chromadb.PersistentClient (backend mempalace,
      src/grimoire/memory/backends/mempalace.py) : store embarque local,
      mono-tenant, sans serveur — il n'y a ni tenant, ni utilisateur
      authentifie, donc pas de surface. Aucune version corrigee publiee.
    approved_by: "Guilhem-Bonnet"
    expires_at: "2027-02-28"
    evidence_refs:
      - "https://github.com/Guilhem-Bonnet/Grimoire-kit/issues/20"
      - "https://api.osv.dev/v1/vulns/CVE-2026-45830"
      - "https://github.com/Guilhem-Bonnet/Grimoire-kit/issues/174"
  - waiver_id: "DEPAUDIT-2026-003"
    check_id: "pip-audit"
    vulnerability_id: "CVE-2026-45831"
    package: "chromadb"
    reason: >-
      SimpleRBACAuthorizationProvider n'evalue pas la portee (tenant, base,
      collection) d'une permission. grimoire-kit ne configure aucun provider
      d'autorisation : PersistentClient n'en expose pas. Aucune version
      corrigee publiee.
    approved_by: "Guilhem-Bonnet"
    expires_at: "2027-02-28"
    evidence_refs:
      - "https://github.com/Guilhem-Bonnet/Grimoire-kit/issues/20"
      - "https://api.osv.dev/v1/vulns/CVE-2026-45831"
      - "https://github.com/Guilhem-Bonnet/Grimoire-kit/issues/174"
  - waiver_id: "DEPAUDIT-2026-004"
    check_id: "pip-audit"
    vulnerability_id: "CVE-2026-45833"
    package: "chromadb"
    reason: >-
      Injection de code via trust_remote_code sur l'endpoint HTTP
      /api/v2/tenants/.../collections/{id}, exploitable par un attaquant
      authentifie disposant de UPDATE_COLLECTION. grimoire-kit n'expose aucun
      serveur ChromaDB et ne positionne jamais trust_remote_code. Aucune
      version corrigee publiee.
    approved_by: "Guilhem-Bonnet"
    expires_at: "2027-02-28"
    evidence_refs:
      - "https://github.com/Guilhem-Bonnet/Grimoire-kit/issues/20"
      - "https://api.osv.dev/v1/vulns/CVE-2026-45833"
      - "https://github.com/Guilhem-Bonnet/Grimoire-kit/issues/174"
# DEPAUDIT-2026-005 a -039 (pillow 12.3.0) : 35 avis publies entre le 2026-10-16
# et le 2026-10-22, tous corriges dans pillow 13.0.0 (PyPI, 2026-10-16). Le kit
# ne peut pas monter : pillow n'est pas une dependance directe, il est tire par
# fastembed (extras qdrant/weaviate, donc [all] et [dev]) qui plafonne
# pillow<13.0 dans toutes ses versions, 0.9.0 comprise (qdrant/fastembed#829,
# PR #830 ouverte). Exposition : grimoire-kit n'importe jamais PIL (grep src,
# tests, scripts : 0 occurrence) et n'utilise fastembed que pour des embeddings
# de texte ; les decodeurs d'images vises (GIF, TIFF, PDF, BMP, PNG, APNG, MSP,
# XBM, SPIDER, EMF/WMF, JPEG, openjp2) ne sont jamais appeles. Bornes au
# 2026-12-31 : a lever des que fastembed publie une version acceptant pillow 13
# (alors plancher pillow>=13.0.0 dans les extras, comme pour torch en 2026-07).
  - waiver_id: "DEPAUDIT-2026-005"
    check_id: "pip-audit"
    vulnerability_id: "CVE-2026-112390"
    package: "pillow"
    reason: >-
      Defaut d'un decodeur ou encodeur d'images de pillow 12.3.0, corrige en
      13.0.0. grimoire-kit n'importe pas PIL ; pillow n'arrive que par
      fastembed (embeddings de texte seulement), qui plafonne pillow<13.0
      (qdrant/fastembed#829). Aucun chemin du kit n'ouvre ni n'ecrit d'image.
    approved_by: "Guilhem-Bonnet"
    expires_at: "2026-12-31"
    evidence_refs:
      - "https://api.osv.dev/v1/vulns/CVE-2026-112390"
      - "https://github.com/qdrant/fastembed/issues/829"
      - "https://github.com/qdrant/fastembed/pull/830"
  - waiver_id: "DEPAUDIT-2026-006"
    check_id: "pip-audit"
    vulnerability_id: "CVE-2026-112391"
