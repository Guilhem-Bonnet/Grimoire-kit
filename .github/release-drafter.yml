# Note de version et numéro de version, décidés par le titre de la PR.
#
# Ils l'étaient auparavant par les étiquettes `type:*`, que `.github/labeler.yml`
# pose selon les *chemins touchés*. Les deux signaux ne répondent pas à la même
# question : un chemin dit de quoi la PR parle, pas quelle sorte de changement
# elle apporte. Constaté sur le brouillon v3.32.1 : aucune règle du labeler ne
# posait `type:feature`, donc l'incrément mineur était inatteignable et une
# refonte de layout sortait en 3.32.1 ; et `type:docs` raflait les
# fonctionnalités, publiées sous « Documentation ».
#
# Le préfixe Conventional Commit du titre, lui, énonce la nature du changement,
# et le job « Titre de PR conventionnel » le rend fiable. `autolabeler` le lit.
#
# Ces étiquettes vivent dans leur propre espace de noms, `release:`. Les faire
# cohabiter avec `type:` ne suffisait pas : release-drafter ne s'arrête pas à la
# première catégorie qui correspond, il liste une PR sous *chacune* de celles
# dont elle porte une étiquette. Comme `type:test`, `type:ci` et `type:tools`
# sont aussi posées par chemin, une fonctionnalité touchant `tests/` et
# `pyproject.toml` ressortait quatre fois dans la même note. Séparer les espaces
# de noms est ce qui rend l'unicité vraie plutôt qu'espérée : une PR porte
# exactement une étiquette `release:`, donc paraît exactement une fois.
#
# Les étiquettes `type:` restent posées pour le tri et la recherche ; elles ne
# décident plus rien de ce qui est publié.

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

autolabeler:
  - label: "breaking"
    title:
      # `feat!:`, `fix(scope)!:` — la rupture est déclarée dans le titre.
      - '/^\w+(\([^)]*\))?!:/'
  - label: "release:feature"
    title:
      - '/^feat(\([^)]*\))?:/'
  - label: "release:fix"
    title:
      - '/^fix(\([^)]*\))?:/'
  - label: "release:docs"
    title:
      - '/^docs(\([^)]*\))?:/'
  - label: "release:test"
    title:
      - '/^test(\([^)]*\))?:/'
  - label: "release:infra"
    title:
      - '/^(ci|build)(\([^)]*\))?:/'
  - label: "release:chore"
    title:
      - '/^(chore|refactor|perf|style)(\([^)]*\))?:/'

categories:
  - title: "⚠️ Breaking Changes"
    labels:
      - "breaking"
  - title: "🚀 Fonctionnalités"
    labels:
      - "release:feature"
      - "enhancement"
  - title: "🐛 Corrections"
    labels:
      - "release:fix"
      - "bug"
  - title: "🏗️ Infrastructure"
    labels:
      - "release:infra"
  - title: "🔧 Maintenance"
    labels:
      - "release:chore"
      - "dependencies"
  - title: "🧪 Tests"
    labels:
      - "release:test"
  - title: "📚 Documentation"
    labels:
      - "release:docs"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - "breaking"
  minor:
    labels:
      - "release:feature"
      - "enhancement"
  patch:
    labels:
      - "release:fix"
      - "bug"
      - "release:docs"
      - "release:infra"
      - "release:test"
      - "release:chore"
  default: patch

template: |
  ## Changements

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
