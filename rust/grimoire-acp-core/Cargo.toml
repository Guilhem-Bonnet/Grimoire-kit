[package]
name = "grimoire-acp-core"
version = "0.1.0"
edition = "2021"
description = "Coeur Rust optionnel de grimoire.acp : validation des messages ACP, machine d'etats de session et routage des permissions, expose via PyO3."
license = "MIT"
publish = false

[lib]
name = "grimoire_acp_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Le coeur ne parle pas au reseau et ne lance aucun processus : il valide et
# classe des messages JSON-RPC deja lus. serde_json suffit — le crate officiel
# `agent-client-protocol` embarque un runtime asynchrone complet dont ce coeur
# pur n'a pas l'usage (choix note sur la tache GAO-acp1-chat-d-001).
serde_json = "1"

# Meme montage que grimoire-policies-core : pyo3 n'est tire que par la feature
# `extension-module`, donc `cargo test --no-default-features` ne le compile pas.
pyo3 = { version = "0.29", features = ["abi3-py312"], optional = true }

[features]
extension-module = ["dep:pyo3", "pyo3/extension-module"]
default = ["extension-module"]
