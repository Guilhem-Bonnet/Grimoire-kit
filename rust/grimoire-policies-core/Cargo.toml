[package]
name = "grimoire-policies-core"
version = "0.1.0"
edition = "2021"
description = "Coeur Rust optionnel de grimoire.policies : moteur de regles, expose via PyO3."
license = "MIT"
publish = false

[lib]
name = "grimoire_policies_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Dependance optionnelle : seule la frontiere PyO3 (le #[pymodule] tout en
# bas de lib.rs) en a besoin. `evaluate_core`, la logique de decision
# elle-meme, n'importe rien de pyo3 — d'ou `cargo test --no-default-features`
# ci-dessous, qui ne compile meme pas cette dependance.
#
# abi3-py312 : une seule extension binaire par (OS, arch) pour tout Python
# >= 3.12 (plancher deja declare par requires-python dans pyproject.toml),
# au lieu d'une par version mineure — cf. section 6 de l'audit sur l'issue
# #354. Sans objet tant que rien n'est publie, mais c'est deja la bonne
# discipline a prendre au premier module porte.
pyo3 = { version = "0.29", features = ["abi3-py312"], optional = true }

[features]
# `extension-module` tire pyo3 (avec sa propre feature `extension-module`,
# qui desactive le lien statique vers libpython — indispensable pour que le
# binaire produit soit chargeable par l'interprete via `maturin
# develop`/`build`). Elle est active par defaut pour que `cargo build` /
# `maturin` produisent une extension utilisable sans option additionnelle.
#
# `cargo test` doit au contraire tourner SANS elle
# (`cargo test --no-default-features`, cf. job CI dedie) : un binaire de
# test doit resoudre tous ses symboles au lien, ce que la feature
# extension-module de pyo3 empeche precisement (elle attend que ce soit
# l'interprete Python, au chargement dynamique, qui les fournisse). Comme
# pyo3 est optionnel et n'est tire par aucune autre feature, desactiver
# `extension-module` retire aussi pyo3 de la compilation : les tests
# n'ont besoin d'aucun interpreteur Python installe.
extension-module = ["dep:pyo3", "pyo3/extension-module"]
default = ["extension-module"]
