# `repo-gates` tourne au pre-push : c'est là que la plage de commits de la
# branche est complète, donc là que la garde `changelog` (une entrée par
# feat/fix/perf) a quelque chose à lire, et une dizaine de secondes de gardes
# ne pèsent pas sur chaque commit.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--strict]
        files: ^src/grimoire/
        additional_dependencies:
          - typer>=0.12
          - ruamel.yaml>=0.18
          - rich>=13.0
        pass_filenames: false
        entry: mypy src/grimoire/

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, "{extends: relaxed, rules: {line-length: {max: 150}}}"]
        files: \.(yml|yaml)$

  - repo: local
    hooks:
      # LA commande des gardes du dépôt : ratchet, changelog, prose, waivers,
      # actions épinglées, tenets, documentation. Identique à l'étape "Repo
      # gates" du job lint de ci-sdk.yml (comparées par
      # tests/unit/scripts/test_repo_gates.py) — une garde rouge en CI l'est ici.
      - id: repo-gates
        name: gardes du dépôt (grimoire gates repo)
        entry: grimoire gates repo
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
