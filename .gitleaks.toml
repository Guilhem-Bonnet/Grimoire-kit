# Configuration gitleaks du kit (D-08). Les règles par défaut restent actives.
title = "Grimoire-kit gitleaks"

[extend]
useDefault = true

# Fixtures de test : ce fichier CONTIENT volontairement des motifs de secrets factices
# (sept occurrences). L'exemption est par chemin et non par empreinte : le kit fusionne
# en squash, le SHA d'un commit de branche disparaît à la fusion et son empreinte
# `.gitleaksignore` ne couvrirait plus le commit squashé.
# Jamais de fichier de production ici : une exemption par chemin désactive TOUTES les
# règles sur le fichier entier, un vrai jeton y passerait. Pour une ligne isolée (exemple
# de doc, commande factice), mettre `gitleaks:allow` sur la ligne : c'est le cas de
# `src/grimoire/memory/validation.py` et de `tests/unit/test_hook_ledger.py`.
[[allowlists]]
description = "Fixtures de secrets factices du validateur d'écriture mémoire"
paths = [
  '''^tests/unit/memory/test_write_validation\.py$''',
]

# Jeton d'exemple de la documentation GitHub, cité comme texte de règle factice dans les
# tests du lint des règles parsables. Le scan court sur tout l'historique de la branche :
# un `gitleaks:allow` posé après coup ne couvre pas le commit qui a introduit la ligne,
# d'où l'exemption ici. Elle est bornée au fichier ET à cette valeur exacte
# (condition AND) : tout autre jeton dans ce fichier reste détecté.
[[allowlists]]
description = "Jeton d'exemple de la documentation GitHub dans les tests du lint des règles"
condition = "AND"
paths = [
  '''^tests/unit/core/test_layered_rules\.py$''',
]
regexes = [
  '''ghp_16C7e42F292c6912E7710c838347Ae178B4a''',
]
