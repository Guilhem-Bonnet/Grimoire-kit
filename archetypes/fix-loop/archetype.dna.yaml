$schema: "grimoire-archetype-dna/v1"

id: fix-loop
name: "Fix Loop"
version: "1.1.0"
description: "Boucle de correction certifiée — zéro 'done' sans preuve d'exécution. FER sessions isolées, sévérité adaptative S1/S2/S3, gauntlet sur déclencheur"
icon: "boomerang"
author: "grimoire-kit"
tags: [fix, loop, tdd, certification, regression, evidence, quality, gauntlet]

inherits: minimal

traits:
  - name: proof-of-execution
    description: "Toute déclaration 'done' exige une preuve d'exécution"
    rule: "JAMAIS écrire 'terminé', 'fait', 'corrigé' sans joindre : 1) la commande exécutée, 2) la sortie réelle, 3) le CC PASS. Une déclaration sans preuve est un mensonge."
    agents_affected: "*"
  - name: fer-isolation
    description: "Chaque session fix est isolée dans un FER (Fix Evidence Record)"
    rule: "Créer un fichier YAML FER au début de chaque session de fix. Y enregistrer chaque cycle test/fix/verify. Clore le FER avec signature avant de passer au ticket suivant."
    agents_affected: [fix-loop-orchestrator]
  - name: severity-adaptive
    description: "Processus adaptatif selon la sévérité S1/S2/S3"
    rule: "S3 (mineur) = cycle rapide 3 phases. S2 (moyen) = cycle standard 6 phases. S1 (critique) = toutes les 9 phases obligatoires incluant META-REVIEW et regression-check complet."
    agents_affected: [fix-loop-orchestrator]
  - name: never-assume-fixed
    description: "Ne jamais supposer qu'un fix est passé sans preuve"
    rule: "Après chaque fix : re-exécuter TOUS les tests liés, pas seulement le test ciblé. Un fix qui casse un autre test = FER non clos."
    agents_affected: "*"
  - name: oracle-before-gauntlet
    description: "Le passage adversarial n'a lieu que s'il existe un critère de sortie exécutable"
    rule: "Avant d'activer CHALLENGER et GATEKEEPER, exiger un oracle machine : une commande avec exit_code attendu qui ÉCHOUE avant le fix et PASSE après. Sans oracle, désactiver les deux phases et marquer le fix 'appliqué, non certifié'. Un fix sans oracle n'entre jamais dans les patterns. Une boucle adversariale sans oracle ne converge pas vers la correction, elle converge vers la satisfaction des critiques."
    agents_affected: [fix-loop-orchestrator]
  - name: gauntlet-on-trigger
    description: "Le gauntlet est déclenché par des signaux objectifs, pas activé par défaut"
    rule: "Ne pas faire tourner CHALLENGER + GATEKEEPER sur tout. Les activer par escalade de sévérité quand un déclencheur objectif est présent : deuxième tentative sur le même symptôme, surface sécurité, cible production, surface d'impact >= 3 composants, écriture de données non réversible. Tracer le déclencheur dans gauntlet_trigger. La sévérité ne redescend jamais en cours de cycle."
    agents_affected: [fix-loop-orchestrator]
  - name: stop-on-sterile-loop
    description: "Arrêt de la boucle dès qu'un tour n'apporte plus d'information neuve"
    rule: "Enregistrer une signature d'échec par itération (commande + exit_code + première ligne de stderr). Deux signatures consécutives identiques = boucle stérile : escalader à l'humain sans consommer le budget restant. Seule exception : un tour supplémentaire si la root cause n'a pas encore été re-challengée, et en passant obligatoirement par la re-analyse."
    agents_affected: [fix-loop-orchestrator]

constraints:
  - id: no-done-without-proof
    description: "Impossible de clore un FER sans preuve de CC PASS"
    enforcement: hard
    checked_by: fix-loop-orchestrator
  - id: no-parallel-fer
    description: "Maximum 1 FER actif par session (éviter l'entrelacement)"
    enforcement: soft
    checked_by: fix-loop-orchestrator
  - id: regression-check-mandatory
    description: "Vérification anti-régression obligatoire en fin de session"
    enforcement: hard
    checked_by: fix-loop-orchestrator
  - id: no-gauntlet-without-oracle
    description: "CHALLENGER et GATEKEEPER ne s'exécutent pas si oracle_available est false"
    enforcement: hard
    checked_by: fix-loop-orchestrator
  - id: no-certified-label-without-oracle
    description: "Le mot 'certifié' est interdit dans un rapport dont oracle_available est false"
    enforcement: hard
    checked_by: fix-loop-orchestrator
  - id: no-silent-severity-downgrade
    description: "La sévérité ne redescend jamais en cours de cycle, seulement à l'ouverture d'un nouveau FER"
    enforcement: hard
    checked_by: fix-loop-orchestrator

values:
  - name: evidence-over-trust
    description: "La preuve prime sur la confiance aveugle dans le LLM"
    priority: 1
  - name: zero-regression
    description: "Un fix qui introduit une régression est pire qu'aucun fix"
    priority: 1
  - name: isolated-context
    description: "Chaque cycle FER est isolé du contexte des autres cycles"
    priority: 2
  - name: proportionate-rigor
    description: "La rigueur coûteuse se déclenche sur signal, elle ne s'applique pas partout par défaut"
    priority: 2

tools_required:
  - name: bash
    description: "Exécution des scripts cc-verify.sh et des cycles de test"
    required: true
    check_command: "which bash"
  - name: python3
    description: "Scripts de test Python + gen-tests.py"
    required: false
    check_command: "which python3"

acceptance_criteria:
  - id: fer-created-before-fix
    description: "Un FER YAML doit être créé au début de chaque session de fix avant d'écrire la première ligne de code"
    enforcement: hard
    context: "Trait fer-isolation — chaque cycle fix est tracer dans un Fix Evidence Record"
    triggers_on: ["**/*"]
    checked_by: fix-loop-orchestrator
  - id: all-tests-rerun-after-fix
    description: "Après chaque fix : toute la suite de tests liée doit être re-exécutée, pas seulement le test ciblé"
    enforcement: hard
    context: "Trait never-assume-fixed — un fix qui casse un autre test = FER non clos"
    triggers_on: ["**/*.spec.*", "**/*.test.*", "**/*_test.*"]
    checked_by: fix-loop-orchestrator
  - id: fer-closed-with-cc-pass
    description: "Un FER ne peut pas être clos sans CC PASS attaché"
    enforcement: hard
    context: "Trait proof-of-execution + contrainte no-done-without-proof"
    triggers_on: ["**/*"]
    checked_by: fix-loop-orchestrator
  - id: severity-protocol-followed
    description: "Le protocole de sévérité correct est suivi (S3=3 phases, S2=6, S1=9)"
    enforcement: soft
    context: "Trait severity-adaptive"
    triggers_on: ["**/*"]
    checked_by: fix-loop-orchestrator
  - id: oracle-fails-before-fix
    description: "L'oracle de la DoD doit échouer sur l'état avant fix, avec la sortie capturée dans evidence[]"
    enforcement: hard
    context: "Trait oracle-before-gauntlet — un oracle qui passe déjà avant le fix ne discrimine rien et ne prouve rien"
    triggers_on: ["**/*"]
    checked_by: fix-loop-orchestrator
  - id: gauntlet-trigger-traced
    description: "Toute escalade de sévérité renseigne severity_escalated_from et gauntlet_trigger dans le FER"
    enforcement: hard
    context: "Trait gauntlet-on-trigger — sans trace du déclencheur, la META-REVIEW ne peut pas mesurer si l'escalade a servi"
    triggers_on: ["**/*"]
    checked_by: fix-loop-orchestrator
  - id: failure-signature-per-iteration
    description: "Chaque itération échouée ajoute une signature d'échec dans failure_signatures[]"
    enforcement: hard
    context: "Trait stop-on-sterile-loop — la détection de boucle stérile compare la signature courante à la précédente"
    triggers_on: ["**/*"]
    checked_by: fix-loop-orchestrator

agents:
  - path: "../../archetypes/fix-loop/agents/fix-loop-orchestrator.tpl.md"
    required: true
    description: "Loop — Orchestrateur boucle fermée, FER, sévérité adaptative, META-REVIEW"

workflows:
  - path: "../../archetypes/fix-loop/workflows/workflow-closed-loop-fix.tpl.md"
    required: true
    description: "Workflow 9 phases boucle de correction certifiée"

shared_context_template: null
prompts_directory: null

compatible_with: [minimal, infra-ops, web-app, stack/go, stack/typescript, stack/python]
incompatible_with: []
requires: []

auto_detect:
  files: []
  directories: []
  confidence_boost: 0    # N'est pas auto-détecté — doit être explicitement demandé
  exclusive: false

changelog:
  - version: "1.1.0"
    date: "2026-08-17"
    changes:
      - "Trait gauntlet-on-trigger — CHALLENGER + GATEKEEPER activés par escalade de sévérité sur déclencheur objectif (T1-repeat, T2-security, T3-prod, T4-surface, T5-data), pas par défaut"
      - "Trait oracle-before-gauntlet — gate bloquant : pas de passage adversarial sans oracle exécutable qui échoue avant le fix"
      - "Trait stop-on-sterile-loop — arrêt sur signature d'échec répétée, avant épuisement de max_iterations"
      - "Valeur proportionate-rigor + 3 contraintes hard + 3 acceptance criteria associés"
      - "Workflow closed-loop-fix v2.6 → v2.7 : phases 1.5, 2.4bis, 4.6 ; champs FER severity_escalated_from, gauntlet_trigger, oracle_available, failure_signatures"
  - version: "1.0.0"
    date: "2026-02-27"
    changes:
      - "DNA initiale — traits proof-of-execution, FER-isolation, severity-adaptive, never-assume-fixed"
