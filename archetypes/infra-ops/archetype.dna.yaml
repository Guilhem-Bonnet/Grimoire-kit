$schema: "grimoire-archetype-dna/v1"

id: infra-ops
name: "Infra Ops"
version: "1.0.0"
description: "Infrastructure & DevOps — 3 agents à faisceau d'outils distinct (généraliste, monitoring, debug système) pour Terraform, K8s, Ansible, monitoring, sécurité, backup ; CI/CD, sécurité, backup/DR et Kubernetes/GitOps portés par des skills attachés au généraliste plutôt que par des agents dédiés au même faisceau (issue #375). Périmètre homelab/auto-hébergement (Proxmox, LXC, K3s, FluxCD, Longhorn) : pensé pour un laboratoire personnel, pas pour du cloud d'entreprise (issue #347)."
icon: "wrench"
author: "grimoire-kit"
tags: [infrastructure, devops, k8s, terraform, ansible, monitoring, security, backup, ops, homelab, self-hosted]

inherits: minimal

traits:
  - name: infrastructure-as-code
    description: "Toute modification infra passe par du code versionné"
    rule: "JAMAIS modifier l'infrastructure manuellement. Toujours via Terraform/Ansible/K8s manifests. Si une modification manuelle est inévitable → créer un ticket de remédiation immédiatement."
    agents_affected: [forge, helm, playbook, terra]
  - name: plan-before-apply
    description: "Plan obligatoire avant apply Terraform"
    rule: "Pour toute action Terraform : terraform plan obligatoire, afficher le résumé (+ add, ~ change, - destroy), demander confirmation si destroy > 0."
    agents_affected: [terra, forge]
  - name: security-first
    description: "La sécurité est non-négociable"
    rule: "Zéro port 22 exposé publiquement. Zéro secret en clair. TLS partout. Validation SOPS/age avant commit."
    agents_affected: [vault, forge, helm]
  - name: backup-before-change
    description: "Snapshot avant toute migration ou changement destructif"
    rule: "Avant DELETE, DROP, migration de données ou upgrade majeur → demander confirmation + suggérer snapshot Longhorn/backup."
    agents_affected: [phoenix, helm, forge]
  - name: observability-mandatory
    description: "Tout service deployé doit être observable"
    rule: "Chaque nouveau service → probe Blackbox ou métriques Prometheus + alerte minimum sur availability. Refuser 'done' sans alerte configurée."
    agents_affected: [hawk, helm, forge]

constraints:
  - id: no-manual-infra-change
    description: "Interdiction de modifier l'infra hors code versionné"
    enforcement: hard
    checked_by: forge
  - id: backup-before-destructive
    description: "Snapshot obligatoire avant opération destructive"
    enforcement: hard
    checked_by: phoenix
  - id: tls-everywhere
    description: "TLS obligatoire sur tous les services exposés"
    enforcement: hard
    checked_by: vault
  - id: cc-infra-pass
    description: "cc-verify.sh --stack infra obligatoire avant livraison"
    enforcement: hard
    checked_by: agent-optimizer

values:
  - name: immutable-infrastructure
    description: "Privilégier le remplacement au patching"
    priority: 1
  - name: least-privilege
    description: "Chaque service avec les permissions minimales nécessaires"
    priority: 1
  - name: gitops-first
    description: "Git comme source de vérité pour l'état de l'infrastructure"
    priority: 1
  - name: chaos-readiness
    description: "L'infra doit survivre à la perte de n'importe quel nœud"
    priority: 2

tools_required:
  - name: terraform
    description: "IaC cloud/on-prem"
    required: true
    check_command: "which terraform"
  - name: kubectl
    description: "Gestion cluster Kubernetes"
    required: false
    check_command: "which kubectl"
  - name: ansible
    description: "Automation configuration serveurs"
    required: false
    check_command: "which ansible"
  - name: docker
    description: "Build et run des conteneurs"
    required: true
    check_command: "which docker"

acceptance_criteria:
  - id: terraform-plan-before-apply
    description: "terraform plan doit être exécuté et validé avant tout apply"
    enforcement: hard
    context: "Trait plan-before-apply — afficher le résumé +/~/- et attendre confirmation si destroy > 0"
    triggers_on: ["**/*.tf", "**/*.tfvars"]
    checked_by: terra
  - id: no-secrets-in-tf-state
    description: "Aucun secret en clair dans les fichiers .tfstate ou variables Terraform"
    enforcement: hard
    context: "Trait security-first — utiliser SOPS ou Vault"
    triggers_on: ["**/*.tf", "**/*.tfvars", "**/*.tfstate"]
    checked_by: vault
  - id: monitoring-alert-on-new-service
    description: "Chaque nouveau service déployé a au moins une alerte de disponibilité"
    enforcement: soft
    context: "Trait observability-mandatory — probe Blackbox ou métriques Prometheus"
    triggers_on: ["**/helm/**/*", "**/k8s/**/*", "**/docker-compose*.yml"]
    checked_by: hawk
  - id: backup-snapshot-before-destructive
    description: "Snapshot ou backup confirmé avant toute migration de données ou destroy"
    enforcement: hard
    context: "Trait backup-before-change"
    triggers_on: ["**/*.tf", "**/migrations/**/*"]
    checked_by: phoenix

agents:
  - path: "../../archetypes/infra-ops/agents/ops-engineer.md"
    required: true
    description: "Forge — généraliste infra : Terraform, Ansible, Docker Compose, LXC, plus les skills attachés infra-pipeline-cicd, infra-security-hardening, infra-backup-dr, infra-k8s-gitops"
  - path: "../../archetypes/infra-ops/agents/monitoring-specialist.md"
    required: true
    description: "Hawk — Prometheus, Grafana, Loki, alertes (faisceau outils distinct : read+edit, pas execute)"
  - path: "../../archetypes/infra-ops/agents/systems-debugger.md"
    required: true
    description: "Debugger systèmes — logs, profiling, incidents (faisceau outils distinct : read+execute, pas edit)"

# Skills attachés par défaut à un agent de cet archétype (issue #375) : le
# savoir-faire de quatre anciens agents (pipeline-architect, security-hardener,
# backup-dr-specialist, k8s-navigator) qui partageaient tous le faisceau
# outils {read, edit, execute} de ops-engineer sans aucune frontière propre —
# rien ne les distinguait au sens de la garde de #372. Le contenu de chaque
# agent devient le corps du skill correspondant, sans perte ; ce qui change,
# c'est que la session ne paie plus sa description à chaque tour, seulement
# quand ops-engineer travaille (voir #377). Cette liste documente
# l'attachement ; l'attachement effectif et vérifié au build est le champ
# `skills:` du frontmatter de l'agent porteur.
skills:
  - path: "../../archetypes/infra-ops/skills/infra-pipeline-cicd.md"
    attached_to: ops-engineer
    description: "Ex-agent Flow — GitHub Actions, Taskfile, pipeline de déploiement, debug CI/CD"
  - path: "../../archetypes/infra-ops/skills/infra-security-hardening.md"
    attached_to: ops-engineer
    description: "Ex-agent Vault — audit sécurité, secrets SOPS/age, TLS, firewall/fail2ban, hardening CIS"
  - path: "../../archetypes/infra-ops/skills/infra-backup-dr.md"
    attached_to: ops-engineer
    description: "Ex-agent Phoenix — audit backup, snapshots Proxmox/Longhorn, plan DR, rétention, clés hors-site"
  - path: "../../archetypes/infra-ops/skills/infra-k8s-gitops.md"
    attached_to: ops-engineer
    description: "Ex-agent Helm — workloads, FluxCD, Longhorn, troubleshooting pods, migration Compose→K3s, GPU, réseau"

workflows:
  - path: "../../archetypes/fix-loop/workflows/workflow-closed-loop-fix.tpl.md"
    required: false
    description: "Boucle de fix certifiée (recommandé pour infra-ops)"

shared_context_template: "../../archetypes/infra-ops/shared-context.tpl.md"
prompts_directory: "../../.github/prompts/team-ops"

compatible_with: [minimal, fix-loop, features/vector-memory, stack/terraform, stack/k8s, stack/ansible, stack/docker]
incompatible_with: [web-app]
requires: []

auto_detect:
  files: ["*.tf", "*.tfvars", "ansible.cfg", "playbook*.yml", "k8s/**/*.yaml"]
  directories: ["terraform/", "ansible/", "k8s/", "infra/"]
  confidence_boost: 90
  exclusive: true  # Si détecté, choose infra-ops automatiquement

changelog:
  - version: "1.0.0"
    date: "2026-02-27"
    changes:
      - "DNA initiale — traits IaC, plan-before-apply, security-first, backup-before-change, observability-mandatory"
