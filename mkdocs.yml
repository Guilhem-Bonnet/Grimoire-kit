      - Commandes:
          - reference/cli/index.md
          - Le projet: reference/cli/projet.md
          - Le tableau de bord: reference/cli/tableau-de-bord.md
          - Les tâches: reference/cli/taches.md
          - La mémoire du projet: reference/cli/memoire.md
          - Le contrôle des preuves: reference/cli/preuve.md
          - La mise à jour: reference/cli/mise-a-jour.md
          - Les flows: reference/cli/flows.md
          - Fournisseurs, routeur, file, pause et tick: reference/cli/fournisseurs.md
          - Configuration, registre et divers: reference/cli/divers.md
      - Configuration: reference/configuration.md
      - grimoire.yaml: reference/grimoire-yaml.md
      - API Python: reference/api.md
      - API de l'observatoire: reference/observatoire.md
      - Surfaces hôtes: reference/hotes.md
      - Contrôles gouvernés: standard/controles-gouvernes.md
      - Flows (généré): nodal/reference/
      - Glossaire: glossaire.md
      - Changelog: reference/changelog.md
