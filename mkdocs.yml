site_name: Grimoire Kit
site_description: Composable AI Agent Platform — personas, memory, workflows, and quality automation.
site_url: https://guilhem-bonnet.github.io/Grimoire-kit/docs/
repo_url: https://github.com/Guilhem-Bonnet/Grimoire-kit
repo_name: Guilhem-Bonnet/Grimoire-kit
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Geist
    code: Geist Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    # navigation.indexes remplace navigation.expand : les corpus sont désormais
    # des onglets à plusieurs niveaux, tout déplier donnerait un mur de liens.
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
  language: fr

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            docstring_style: numpy
            show_if_no_docstring: false

hooks:
  - mkdocs_hooks/signals.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/forge-theme.css
  - stylesheets/presentation-onepager.css

extra_javascript:
  - javascripts/presentation-onepager.js

# Trois corpus, trois onglets. Le manuel décrit ce que le produit fait ; le
# standard décrit la norme qu'il applique. Les plans cibles et backlogs ne
# sont pas de la documentation et vivent dans `planning/`, hors du site.
nav:
  - Accueil: index.md
  - Manuel:
      - Présentation & Découverte: presentation-decouverte.md
      - Signaux & nouveautés: signaux.md
      - Démarrage:
          - Quick Start: getting-started.md
          - Quick Start (English): getting-started.en.md
          - Setup VS Code: vscode-setup.md
          - Onboarding: onboarding.md
      - Concepts:
          - Architecture: concepts.md
          - Surfaces hôtes: hosts.md
          - Mémoire: memory-system.md
          - Workflows: workflow-design-patterns.md
          - Taxonomie Workflows: workflow-taxonomy.md
          - Guardrails runtime agentiques: grimoire-game-runtime-guardrails.md
      - Atelier local & blueprints: serve-blueprints.md
      - Guides:
          - Extensions & marketplace: extensions-marketplace.md
          - SDK Python: sdk-guide.md
          - Créer un agent: creating-agents.md
          - Archétypes: archetype-guide.md
          - Intégration MCP: mcp-integration.md
          - Observatory API: observatory-api.md
          - Référence YAML: grimoire-yaml-reference.md
          - Plugin Development: plugin-development.md
          - Protocole d'évaluation: evals-protocol.md
          - R&D expérimental: rnd.md
      - Référence:
          - CLI: cli-reference.md
          - Configuration: config-reference.md
          - API: api-reference.md
          - Changelog: changelog.md
      - Migration:
          - v2 → v3: migration-v2-v3.md
      - Aide:
          - FAQ: faq.md
          - Troubleshooting: troubleshooting.md
      - ADR:
          - "001 — No Multi-LLM": adr-001-no-multi-llm.md
          - "002 — SemVer Policy": adr-002-semver-policy.md
          - "003 — Dualité mémoire": adr-003-memory-duality.md
          - "004 — Gouvernance des runtimes cloud": adr-004-gouvernance-des-runtimes-cloud.md
          - "005 — Mission Ledger source de vérité": adr-005-mission-ledger-source-of-truth.md
  - Standard agentique:
      - standard/index.md
      - Intégration: standard/integration.md
      - Installation par besoins: standard/install-by-needs.md
      - Contrôles gouvernés: standard/controles-gouvernes.md
