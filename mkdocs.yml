          - standard/index.md
          - Le refus de preuve, ligne par ligne: explications/le-refus-de-preuve.md
      - Les limites: explications/les-limites.md
      - Comparaison avec AWS AI-DLC: explications/comparaison-ai-dlc.md
      - Concepts: explications/concepts.md
      - Les flows:
          - nodal/index.md
          - Ce que le graphe fait: nodal/concepts/execution.md
          - Contrats et pins: nodal/concepts/contrats-et-pins.md
          - Les trois canaux: nodal/concepts/canaux.md
          - Les portes: nodal/concepts/portes.md
          - Sept primitives: nodal/concepts/primitives.md
      - Workflows: explications/workflows.md
      - Taxonomie des workflows: explications/taxonomie-des-workflows.md
      - "Doctrine : quand créer un artefact": explications/quand-creer-un-artefact.md
      - Garde-fous du runtime: explications/garde-fous-runtime.md
      - Expérimental: explications/experimental.md
      - Décisions:
          - "001 — No Multi-LLM": explications/decisions/adr-001-no-multi-llm.md
          - "002 — SemVer Policy": explications/decisions/adr-002-semver-policy.md
          - "003 — Dualité mémoire": explications/decisions/adr-003-memory-duality.md
