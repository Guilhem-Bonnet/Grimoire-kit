site_name: Grimoire
site_description: Dashboard, task board, project memory and evidence check for code you delegate to agents (Claude Code, Copilot).
site_url: https://guilhem-bonnet.github.io/Grimoire-kit/docs/
repo_url: https://github.com/Guilhem-Bonnet/Grimoire-kit
repo_name: Guilhem-Bonnet/Grimoire-kit
edit_uri: edit/main/docs/

theme:
  name: material
  font: false                     # polices auto-hébergées (docs/assets/fonts), aucune ressource tierce
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  logo: assets/brand/mark.svg     # le chevron seul, recoloré en rouille par douce.css
  favicon: assets/brand/favicon.svg
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    # navigation.indexes remplace navigation.expand : les corpus sont désormais
    # des onglets à plusieurs niveaux, tout déplier donnerait un mur de liens.
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
  language: fr

plugins:
  - search
  # La référence du système nodal (52 pages) est rendue ici, au build, depuis
  # le schéma, les primitives et le catalogue. Rien n'est commité : une page
  # ne peut donc pas être en retard sur sa source. `literate-nav` lit le
  # SUMMARY.md que le générateur produit avec elles.
  - gen-files:
      scripts:
        - scripts/gen_doc_reference.py
  - literate-nav
  - redirects:
      redirect_maps:
        adr-001-no-multi-llm.md: explications/decisions/adr-001-no-multi-llm.md
        adr-002-semver-policy.md: explications/decisions/adr-002-semver-policy.md
        adr-003-memory-duality.md: explications/decisions/adr-003-memory-duality.md
        adr-004-gouvernance-des-runtimes-cloud.md: explications/decisions/adr-004-gouvernance-des-runtimes-cloud.md
        adr-005-mission-ledger-source-of-truth.md: explications/decisions/adr-005-mission-ledger-source-of-truth.md
        adr-006-vue-de-travail.md: explications/decisions/adr-006-vue-de-travail.md
        adr-007-unification-des-taches.md: explications/decisions/adr-007-unification-des-taches.md
        adr-008-actions-infrastructure-locale-typees.md: explications/decisions/adr-008-actions-infrastructure-locale-typees.md
        api-reference.md: reference/api.md
        archetype-guide.md: guides/choisir-un-archetype.md
        artifact-doctrine.md: explications/quand-creer-un-artefact.md
        cadrage.md: guides/cadrage-produit.md
        changelog.md: reference/changelog.md
        cli-reference.md: reference/cli/index.md
        concepts.md: explications/concepts.md
        config-reference.md: reference/configuration.md
        creating-agents.md: guides/creer-un-agent.md
        evals-protocol.md: guides/evaluer-un-flow.md
        extensions-marketplace.md: guides/extensions.md
        faq.md: guides/faq.md
        getting-started.en.md: tutoriels/premier-projet.md
        getting-started.md: tutoriels/premier-projet.md
        grimoire-game-runtime-guardrails.md: explications/garde-fous-runtime.md
        grimoire-yaml-reference.md: reference/grimoire-yaml.md
        hosts.md: reference/hotes.md
        mcp-integration.md: guides/mcp.md
        memory-system.md: explications/memoire.md
        migration-v2-v3.md: guides/migration-v2-v3.md
        observatory-api.md: reference/observatoire.md
        onboarding.md: tutoriels/onboarding.md
        plugin-development.md: guides/developper-un-plugin.md
        presentation-decouverte.md: index.md
        rnd.md: explications/experimental.md
        sdk-guide.md: guides/sdk-python.md
        serve-blueprints.md: guides/atelier-blueprints.md
        signaux.md: index.md
        standard/install-by-needs.md: guides/installer-par-besoins.md
        standard/integration.md: guides/rendre-la-preuve-bloquante.md
        troubleshooting.md: guides/depannage.md
        upgrade.md: guides/mettre-a-jour.md
        vscode-setup.md: guides/vscode.md
        workflow-design-patterns.md: explications/workflows.md
        workflow-taxonomy.md: explications/taxonomie-des-workflows.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            docstring_style: numpy
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  # Les listes de définitions servent aux pages de concepts, qui expliquent des
  # termes un par un plutôt qu'en tableau.
  - def_list
  - pymdownx.details
  # Les diagrammes des exemples sont dérivés des .blueprint.json : sans ce
  # fence, ils s'afficheraient comme du texte au lieu d'être rendus.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/douce.css

# Le manuel suit Diátaxis : tutoriels (apprendre), guides (atteindre un but),
# référence (consulter), explications (comprendre). Les plans cibles, bancs et
# veilles ne sont pas de la documentation : ils sont exclus du site.
exclude_docs: |
  _archive/
  audits/
  bench/
  security/
  veille/
  cockpit-coverage-matrix.md

nav:
  - Accueil: index.md
  - Tutoriels:
      - tutoriels/index.md
      - Premier projet: tutoriels/premier-projet.md
      - Onboarding: tutoriels/onboarding.md
      - Votre premier blueprint: nodal/premier-blueprint.md
  - Guides:
      - guides/index.md
      - Installer par besoins: guides/installer-par-besoins.md
      - Mettre à jour un projet: guides/mettre-a-jour.md
      - Migration v2 → v3: guides/migration-v2-v3.md
      - Rendre la preuve bloquante: guides/rendre-la-preuve-bloquante.md
      - VS Code: guides/vscode.md
      - Serveur MCP: guides/mcp.md
      - SDK Python: guides/sdk-python.md
      - Extensions: guides/extensions.md
      - Développer un plugin: guides/developper-un-plugin.md
      - Créer un agent: guides/creer-un-agent.md
      - Choisir un archétype: guides/choisir-un-archetype.md
      - Cadrage produit: guides/cadrage-produit.md
      - Travail en équipe: guides/travail-en-equipe.md
      - L'atelier de blueprints: guides/atelier-blueprints.md
      - Évaluer un flow: guides/evaluer-un-flow.md
      - Dépanner: guides/depannage.md
      - Questions fréquentes: guides/faq.md
  - Référence:
