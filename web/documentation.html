<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentation — Grimoire Kit</title>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Documentation — Grimoire Kit"/>
  <meta property="og:description" content="Grimoire Kit — l'OS agentique dans l'IDE : orchestration, standard gouverné (36 patterns vérifiables), catalogue de 78, mémoire, observabilité. Tout est tracé, vérifiable, composable."/>
  <meta property="og:url" content="https://guilhem-bonnet.github.io/Grimoire-kit/docs/"/>
  <meta name="twitter:card" content="summary"/>
  <meta name="description" content="Point d'entrée vers le manuel Grimoire Kit, construit par mkdocs et publié sous /docs/." />
  <link rel="canonical" href="https://guilhem-bonnet.github.io/Grimoire-kit/docs/" />
  <link rel="stylesheet" href="forge-tokens.css" />
  <link rel="stylesheet" href="forge-base.css" />
  <link rel="stylesheet" href="forge-motion.css" />
  <link rel="stylesheet" href="atelier.css" />
  <script src="grimoire-mode.js"></script>
  <style>
    /* Page de passage : rien à mettre en scène, une carte centrée suffit. */
    #documentation { display: grid; place-items: center; min-height: 60vh; padding: 64px 24px; }
    .doc-portal { max-width: 34rem; text-align: left; }
    .doc-portal[hidden] { display: none; }
    .doc-portal h1 { font-size: 1.5rem; margin: 0 0 12px; }
    .doc-portal p { color: var(--ink-muted); line-height: 1.65; margin: 0 0 20px; }
    .doc-portal code { font-family: var(--font-mono); font-size: 0.85em; }
    .doc-portal .cta { display: inline-block; padding: 10px 18px; border: 1px solid var(--accent);
      color: var(--accent); border-radius: var(--r-sm); text-decoration: none; font-family: var(--font-mono);
      font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .doc-portal .cta:hover { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body class="at-body">
<a href="#documentation" class="skip-link">Aller au contenu</a>
<nav id="forge-nav" aria-label="Navigation principale"></nav>

<div class="at-app">
<aside class="at-side" id="atelier-side"></aside>
<div class="at-main">
<main id="main">

<section id="documentation">
  <!-- Affiché seulement si le manuel n'est pas servi à côté (atelier local :
       `grimoire serve` ne sert que web/, pas le site construit). En ligne, la
       sonde ci-dessous redirige avant que cette carte ne s'affiche. -->
  <div class="doc-portal" id="doc-portal" hidden>
    <h1>Le manuel est en ligne</h1>
    <p>
      Cette page est servie par l'atelier local, qui ne contient que l'interface.
      Le manuel Grimoire Kit est construit par mkdocs et publié séparément.
    </p>
    <p>
      Pour le consulter hors ligne depuis le dépôt&nbsp;:
      <code>make docs-serve</code>.
    </p>
    <a class="cta" id="doc-portal-link"
       href="https://guilhem-bonnet.github.io/Grimoire-kit/docs/"
       target="_blank" rel="noopener">Ouvrir le manuel ↗</a>
  </div>
  <noscript>
    <div class="doc-portal" style="display:block">
      <h1>Documentation</h1>
      <p><a href="docs/">Ouvrir le manuel Grimoire Kit</a></p>
    </div>
  </noscript>
</section>

</main>
<div class="at-status" id="atelier-status"></div>
</div>
</div>

<script src="atelier-nav.js"></script>
<script src="forge-nav.js"></script>
<script>
/* Le manuel vit sous /docs/ quand le site complet est publié ; l'atelier local
   ne sert que web/. On sonde avant de choisir : redirection si le manuel est
   là, carte de renvoi sinon. Pas de flash — la carte n'apparaît qu'en repli. */
(function () {
  'use strict';
  const MANUAL = 'docs/';
  const portal = document.getElementById('doc-portal');

  function fallback() { if (portal) portal.hidden = false; }

  fetch(MANUAL + 'index.html', { method: 'HEAD' })
    .then(r => { if (r.ok) location.replace(MANUAL); else fallback(); })
    .catch(fallback);

  /* `GrimoireDocsBase` sait déjà où vit le manuel quand il n'est pas servi
     ici — atelier local ou fichier ouvert depuis le disque. */
  const link = document.getElementById('doc-portal-link');
  if (link && window.GrimoireDocsBase) link.href = window.GrimoireDocsBase;
})();
</script>
</body>
</html>
