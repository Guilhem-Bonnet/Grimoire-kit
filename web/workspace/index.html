<!doctype html>
<html lang="fr" data-theme="dark" data-density="decouverte" data-focus="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire — vue de travail</title>
<!--
  La coque unique, servie telle quelle par `grimoire serve` (un projet) et
  `grimoire cockpit serve` (une flotte). Ce fichier ne contient QUE la
  structure : pas de couleur, pas de logique. Les tokens sont dans tokens.css,
  la géométrie dans shell.css, le comportement dans shell.js.

  Le squelette est délibérément vide : chaque espace est monté par son module
  (spaces/*.js), qui expose `mount(root, ctx)`. Cinq lots travaillent en
  parallèle sur des fichiers disjoints — voir README.md.
-->
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./shell.css">
</head>
<body>

<div id="shell">

  <!-- Barre d'application : marque, projet, espaces, palette -->
  <header id="appbar">
    <div id="brand"><svg class="ico" aria-hidden="true"><use href="icons.svg#grimoire"/></svg><span>GRIMOIRE</span></div>
    <div class="row">
      <button class="chip chip-pick" id="project-chip" type="button" data-term="projet"
              title="Changer de projet ou naviguer (ouvre la palette)">
        <span class="dot" id="project-dot"></span>
        <span id="project-name">—</span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
    </div>
    <nav class="spaces-nav" aria-label="Espaces de travail">
      <div id="spaces" role="tablist" aria-label="Espaces de travail"></div>
    </nav>
    <div class="grow"></div>
    <div class="row">
      <!-- Décisions en attente d'un humain (K6), de tout le registre sur le cockpit :
           visible quel que soit l'espace, un clic ouvre la vue Décisions d'Exécuter. -->
      <button class="chip pill warn" id="decisions-pill" type="button" hidden
              aria-label="Décisions en attente">
        <svg class="ico" aria-hidden="true"><use href="icons.svg#inbox"/></svg>
        <span id="decisions-count">0</span><span class="pill-lbl" id="decisions-lbl"> décisions</span>
      </button>
      <button class="chip" id="palette-open" type="button" aria-label="Rechercher ou commander">
        <span class="row palette-what"><svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#search"/></svg><span class="palette-lbl">Rechercher ou commander</span></span><span class="kbd">⌘K</span>
      </button>
    </div>
  </header>

  <div id="middle">

    <!-- Rail : 1 explorateur, 2 bibliothèque, 3 preuves, 4 inspecteur/mémoire, 5 dock -->
    <nav id="rail" aria-label="Panneaux"></nav>

    <!-- Panneau gauche : explorateur -->
    <aside class="panel panel-left" id="panel-explorer" data-state="pinned" aria-label="Explorateur">
      <div class="panel-head">
        <span style="font-weight:500">Explorateur</span>
        <span class="grow"></span>
        <span class="kbd">1</span>
        <button class="panel-close" type="button" data-close="explorer" aria-label="Fermer l'explorateur">
          <svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#cross"/></svg>
        </button>
        <button class="pin" type="button" aria-pressed="true" aria-label="Épingler l'explorateur" data-pin="explorer">
          <svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#i-ui-pin"/></svg>
        </button>
      </div>
      <div class="panel-body tree" id="explorer-body" aria-live="polite"></div>
      <div class="panel-resize" data-resize="explorer" role="separator" aria-orientation="vertical" aria-label="Redimensionner l'explorateur" tabindex="-1"></div>
    </aside>

    <!-- Centre : barre de document, toile, dock -->
    <main id="center">
      <div id="docbar">
        <div class="row soft" id="breadcrumb"></div>
        <div class="grow"></div>
        <div class="seg" id="zoom-seg" role="group" aria-label="Niveau de zoom" data-term="niveau-de-zoom"></div>
        <div class="seg" id="view-seg" role="group" aria-label="Vue" data-term="vue"></div>
        <span class="chip" id="doc-validation" hidden><span class="dot"></span><span></span></span>
      </div>

      <section id="canvas" data-grid="off" role="tabpanel" aria-live="polite" aria-busy="false"></section>

      <section id="dock" data-state="pinned" aria-label="Dock">
        <div id="dock-tabs" role="tablist"></div>
        <div id="dock-body" role="tabpanel"></div>
      </section>
    </main>

    <!-- Panneau droit : inspecteur -->
    <aside class="panel panel-right" id="panel-inspector" data-state="pinned" aria-label="Inspecteur">
      <div class="panel-head">
        <span style="font-weight:500">Inspecteur</span>
        <span class="grow"></span>
        <span class="kbd">4</span>
        <button class="panel-close" type="button" data-close="inspector" aria-label="Fermer l'inspecteur">
          <svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#cross"/></svg>
        </button>
        <button class="pin" type="button" aria-pressed="true" aria-label="Épingler l'inspecteur" data-pin="inspector">
          <svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#i-ui-pin"/></svg>
        </button>
      </div>
      <div class="panel-body" id="inspector-body" aria-live="polite"></div>
      <div class="panel-resize" data-resize="inspector" role="separator" aria-orientation="vertical" aria-label="Redimensionner l'inspecteur" tabindex="-1"></div>
    </aside>

    <!-- Panneau droit : preuves (#534) — possédé par la coque, jamais par un
         espace, pour rester utilisable depuis n'importe lequel des six. -->
    <aside class="panel panel-right" id="panel-evidence" data-state="collapsed" aria-label="Preuves">
      <div class="panel-head">
        <span style="font-weight:500">Preuves</span>
        <span class="grow"></span>
        <span class="kbd">3</span>
        <button class="panel-close" type="button" data-close="evidence" aria-label="Fermer les preuves">
          <svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#cross"/></svg>
        </button>
        <button class="pin" type="button" aria-pressed="false" aria-label="Épingler les preuves" data-pin="evidence">
          <svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#i-ui-pin"/></svg>
        </button>
      </div>
      <div class="panel-body" id="evidence-body" aria-live="polite"></div>
      <div class="panel-resize" data-resize="evidence" role="separator" aria-orientation="vertical" aria-label="Redimensionner les preuves" tabindex="-1"></div>
    </aside>

  </div>

  <!-- Barre d'état -->
  <footer id="statusbar">
    <span id="st-kit" class="st-extra">grimoire-kit —</span>
    <span id="st-api" class="st-extra">API locale</span>
    <span class="row" style="gap:6px"><span class="dot" id="st-standard-dot"></span><span id="st-standard">standard —</span></span>
    <span id="st-host" class="st-extra">—</span>
    <span class="row" id="st-live" style="gap:6px" title="Actualisation automatique">
      <svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#refresh"/></svg><span id="st-live-text">actualisation…</span>
    </span>
    <span class="grow"></span>
    <button class="chip" id="st-density" type="button" data-term="densite">Densité</button>
    <div class="seg seg-s" id="st-theme" role="group" aria-label="Thème">
      <button type="button" data-theme-pref="system" aria-pressed="false" aria-label="Système" title="Thème du système">
        <svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#monitor"/></svg>
      </button>
      <button type="button" data-theme-pref="light" aria-pressed="false" aria-label="Clair" title="Thème clair">
        <svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#sun"/></svg>
      </button>
      <button type="button" data-theme-pref="dark" aria-pressed="false" aria-label="Sombre" title="Thème sombre">
        <svg class="ico ico-s" aria-hidden="true"><use href="icons.svg#moon"/></svg>
      </button>
    </div>
    <span class="row st-extra" style="gap:6px">Mode concentration <span class="kbd">⇧⌘F</span></span>
  </footer>

</div>

<!-- Palette de commandes -->
<div id="palette" hidden role="dialog" aria-modal="true" aria-label="Palette de commandes">
  <div id="palette-box">
    <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
           placeholder="Aller à, ou lancer une commande grimoire…">
    <ul id="palette-list" role="listbox"></ul>
  </div>
</div>

<script type="module" src="./shell.js"></script>
</body>
</html>
