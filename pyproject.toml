[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grimoire-kit"
dynamic = ["version"]
description = "Composable AI agent platform — personas, memory, workflows, and quality automation for any project."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Guilhem Bonnet" }]
keywords = ["ai", "agents", "llm", "workflow", "copilot", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Typing :: Typed",
]

dependencies = [
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
# Borne haute maintenue, mais élargie : mcp 2.0 avait retiré
# `mcp.server.fastmcp`, et sans borne `grimoire-kit[mcp]` livrait un serveur
# qui ne démarrait pas. grimoire.mcp.server accepte désormais les deux façades
# (`MCPServer` en 2.x, `FastMCP` en 1.x), donc la 2 passe. La borne reste
# fermée sur la 3 : une majeure non parue ne peut pas être déclarée compatible.
# Lever la borne demande de porter le serveur sur l'API 2.x.
mcp = ["mcp>=1.0,<3"]
# Les extras ci-dessous restent volontairement sans borne haute. Audit du
# 2026-08-15, mené après la panne mcp : chacun n'est utilisé qu'à travers un
# point d'entrée canonique de haut niveau, celui qui survit aux majeures.
# C'est ce qui les distingue de mcp, qui importait le sous-module
# `mcp.server.fastmcp` — déplacé en 2.0, d'où la rupture.
#
#   neo4j                  neo4j.GraphDatabase.driver      testé OK sur 6.2.0
#   qdrant-client          QdrantClient                    testé OK sur 1.19.0
#   ollama                 module de premier niveau        testé OK sur 0.6.2
#   tantivy                SchemaBuilder                   testé OK sur 0.26.0
#   sentence-transformers  SentenceTransformer             exporté en 5.7.0
#
# Borner par réflexe aurait créé des conflits de résolution chez les
# utilisateurs sans rien protéger. Re-tester avant d'ajouter une borne.
# fastembed remplace sentence-transformers + torch : 203 Mo contre 4,8 Go pour le
# meme modele par defaut (mesure du 2026-08-26). Les deux moteurs produisent des
# vecteurs identiques a 2e-7 pres — l export ONNX de Qdrant est fidele, pas
# quantifie — donc la bascule ne demande aucun re-index. Borne basse en 0.8 :
# les versions anterieures retombaient sur un telechargement distant malgre
# HF_HUB_OFFLINE (qdrant/fastembed#615, #218). sentence-transformers reste
# supporte a l execution quand il est deja installe, mais n est plus tire.
qdrant = ["qdrant-client>=1.9", "fastembed>=0.8"]
weaviate = ["fastembed>=0.8"]
neo4j = ["neo4j>=5.0"]
# Consommé par src/grimoire/memory/hot.py (RedisHotMemory, cache chaud du
# Memory OS) via un import dynamique — invisible à un grep `import redis`,
# d'où une affirmation erronée dans le commit d'audit initial. Également
# utilisé par framework/tools/message-bus.py, en zone gelée. L'extra reste
# nécessaire tant que la couche chaude existe.
redis = ["redis>=5.0"]
# Borne tenue, instruite le 2026-09-04 (#174) sur deux venv jetables, 0.6.3 et
# 1.5.9 : les sept appels que `mempalace` fait au client embarqué
# (PersistentClient, get_or_create_collection, upsert, get, query, delete,
# count) rendent les mêmes clés en 1.x, et un palais écrit par 0.6 s'y relit
# sans migration — mais pas l'inverse (un palais 1.x est illisible en 0.6 :
# KeyError '_type'). Lever la borne n'apporte donc aucune fonctionnalité et
# ajoute deux CVE au périmètre audité (CVE-2026-45829 / PYSEC-2026-311,
# injection de code pré-authentification, 1.x seulement). Les trois CVE
# waivées n'ont de correctif sur aucune version, 1.5.9 comprise. Condition
# de réouverture : un correctif amont pour ces trois-là, qui paraîtra sur 1.x.
mempalace = ["chromadb>=0.6,<0.7"]
ollama = ["ollama>=0.3"]
search = ["tantivy>=0.26"]
all = ["grimoire-kit[mcp,qdrant,weaviate,neo4j,redis,mempalace,ollama,search]"]
dev = [
    "grimoire-kit[all]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=4.0",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
    "mkdocstrings[python]>=0.25",
    # La référence du système nodal est rendue au build depuis les sources
    # (schéma, primitives, catalogue) : rien n'est commité, donc rien ne rote.
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[project.scripts]
grimoire = "grimoire.cli.app:cli"
grimoire-mcp = "grimoire.mcp.server:main"
# Lifecycle hooks run once per tool call. Routing them through `grimoire host
# hook` builds the whole Typer tree first — every `cmd_*` module imported to
# resolve one subcommand — for a measured 391 ms per call against 116 ms here.
grimoire-hook = "grimoire.hosts.runtime:main"

[project.entry-points."grimoire.tools"]
[project.entry-points."grimoire.backends"]

[project.urls]
Homepage = "https://github.com/Guilhem-Bonnet/Grimoire-kit"
Repository = "https://github.com/Guilhem-Bonnet/Grimoire-kit"
Documentation = "https://guilhem-bonnet.github.io/Grimoire-kit/"
Changelog = "https://github.com/Guilhem-Bonnet/Grimoire-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/Guilhem-Bonnet/Grimoire-kit/issues"

[tool.hatch.version]
path = "src/grimoire/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/grimoire"]

[tool.hatch.build.targets.wheel.force-include]
"archetypes" = "grimoire/archetypes"
"extensions" = "grimoire/extensions"
"framework" = "grimoire/data/framework"
"web" = "grimoire/data/web"
"version.txt" = "grimoire/version.txt"
"registry/kit-file-hashes.json" = "grimoire/data/kit-file-hashes.json"
"scripts/gen-site-data.py" = "grimoire/data/site-scripts/gen-site-data.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/grimoire/",
    "archetypes/",
    "extensions/",
    "framework/",
    "web/",
    "version.txt",
    "registry/kit-file-hashes.json",
    "scripts/gen-site-data.py",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
# Ruff configuration lives in ruff.toml — single source of truth.

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["_grimoire/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

# Optional backend SDKs (installed only via extras: neo4j, mempalace/chromadb,
# weaviate, qdrant, redis, ollama, mcp). In CI the [all] extra is installed so
# these imports resolve; in a minimal contributor env they are absent, so we
# suppress import-not-found here instead of scattering inline `type: ignore`s.
[[tool.mypy.overrides]]
module = [
    "neo4j.*",
    "chromadb.*",
    "weaviate.*",
    "qdrant_client.*",
    "sentence_transformers.*",
    "fastembed.*",
    "huggingface_hub.*",
    "redis.*",
    "ollama.*",
    "jsonschema.*",
    "tantivy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short -x"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests requiring external services (network, Ollama, Qdrant)",
    "regression: marks known regression tests",
    "bench: marks performance benchmark tests",
]

[tool.coverage.run]
source = ["src/grimoire"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
# Cliquet : la couverture mesurée est de 75,58 % sur les trois plateformes de
# la matrice, identique en local et en CI. Un seuil à 70 laissait 5,6 points
# acquis non verrouillés — une régression pouvait les rendre sans rien casser.
# Le seuil se relève quand la couverture monte, jamais l'inverse.
fail_under = 75
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
