# Docker Compose — Qdrant pour développement local Grimoire
# Généré par : grimoire-init.sh --memory qdrant-docker
#
# Usage :
#   docker compose -f docker-compose.memory.yml up -d
#   docker compose -f docker-compose.memory.yml down
#
# Dashboard : http://localhost:6333/dashboard
#
# Ports : GRIMOIRE_QDRANT_PORT / GRIMOIRE_QDRANT_GRPC_PORT (l'ancienne graphie
# Grimoire_QDRANT_PORT reste acceptée). Un second projet sur la même machine
# change ces ports ; le nom du conteneur ET celui du volume sont dérivés du projet
# Compose (nom du dossier, ou COMPOSE_PROJECT_NAME) : plus de `container_name` ni de
# volume à nom fixe, qui faisaient partager un même stockage à deux Qdrant.
# Un projet qui avait déjà un volume `grimoire-qdrant-storage` garde son fichier
# généré tel quel (il n'est pas réécrit) ; pour migrer, voir docs/explications/memoire.md.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "${GRIMOIRE_QDRANT_PORT:-${Grimoire_QDRANT_PORT:-6333}}:6333"
      - "${GRIMOIRE_QDRANT_GRPC_PORT:-${Grimoire_QDRANT_GRPC_PORT:-6334}}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
