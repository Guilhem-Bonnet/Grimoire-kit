# Exigences obligatoires à un niveau que le kit ne couvre par aucun artefact.
# Cumulatif : un trou de N1 reste un trou à N4.
gaps:
  N1:
    - {id: AG-QUA-003, label: "Dossier d'acceptation client", evidence: "exigences L74 ; matrice L58"}
    - {id: AG-RET-001, label: "Registre de rétention de tout artefact produit", evidence: "exigences L95 ; matrice L69"}
  N2:
    - {id: AG-TOL-001, label: "Registre d'outils avec risque et permissions", evidence: "exigences L60 ; matrice L49"}
    - {id: AG-TOL-003, label: "Contrat MCP (owner, scopes, timeout, logs)", evidence: "exigences L62 ; matrice L51"}
    - {id: AG-TOL-005, label: "Erreurs d'outil capturées comme preuve ou incident", evidence: "exigences L64 ; matrice L53"}
    - {id: AG-INC-001, label: "Containment d'anomalie critique", evidence: "exigences L85 ; matrice L64"}
    - {id: AG-RET-003, label: "Sources remplacées pointant vers leur remplacement", evidence: "exigences L97 ; matrice L71"}
    - {id: AG-RET-004, label: "Nettoyage périodique TTL, doublons, obsolescence", evidence: "exigences L98 ; matrice L72"}
    - {id: AG-RET-005, label: "Purge de mémoire contaminée suivie comme incident", evidence: "exigences L99 ; matrice L73"}
  N3:
    - {id: AG-ORC-004, label: "Limitation du WIP, pas de délégation ouverte", evidence: "exigences L24 ; matrice L28"}
  N4:
    - {id: AG-INC-002, label: "Incident : containment, correction, purge, prévention", evidence: "exigences L86 ; matrice L65"}
    - {id: AG-INC-003, label: "Incidents récurrents alimentant evals, hooks, gouvernance", evidence: "exigences L87 ; matrice L66"}
    - {id: AG-DYN-001, label: "Création dynamique répondant à un gap identifié", evidence: "exigences L108"}
    - {id: AG-DYN-003, label: "Artefact éphémère avec règle d'expiration", evidence: "exigences L110"}
    - {id: AG-DYN-004, label: "Promotion vers durable justifiée", evidence: "exigences L111"}
    - {id: AG-AUD-001, label: "Matrice de traçabilité exigence, contrôle, preuve, verdict", evidence: "exigences L127 ; matrice L79", note: "Ce fichier en est le premier lot."}
    - {id: AG-AUD-003, label: "Matrice risques, contrôles, preuves", evidence: "exigences L129 ; matrice L81"}
  N5: []
