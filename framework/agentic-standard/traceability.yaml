$schema: "grimoire-agentic-standard-traceability/v1"

# Ce que chaque artefact du bridge satisfait dans la norme amont, et ce que
# chaque vérificateur contrôle. Un lien n'est posé que si la norme nomme
# l'objet que l'artefact produit (colonne « preuves minimales » de la matrice
# normative, ou nom du contrôle au catalogue). Un lien seulement conceptuel est
# une ligne vide avec sa raison — pas une invention.
#
# C'est l'artefact que la norme exige en AG-AUD-001 : conformité déclarée
# reliée à exigence, contrôle, preuve. `grimoire standard traceability` le rend.

metadata:
  upstream_commit: "53b2c34258580bd965631bcc186b21947b44c71e"
  reconciled_on: "2026-09-03"
  sources:
    - "docs/matrice-normative-maitresse.md"
    - "docs/exigences-normatives-structure-agentique.md"
    - "docs/niveaux-conformite-agentique.md"
    - "docs/catalogue-controles-agentiques.md"

# Profils du kit → niveaux de conformité de la norme (N0 à N5).
levels:
  starter: N1
  controlled: N2
  orchestrated: N3
  governed: N4
  production: N5

# Contrôles définis au catalogue mais cités par aucune exigence de la matrice :
# un artefact qui ne se rattache qu'à l'un d'eux n'a pas d'exigence AG-* citable.
controls_without_requirement: [CTRL-DRY-002, CTRL-SEC-002, CTRL-UI-001]

