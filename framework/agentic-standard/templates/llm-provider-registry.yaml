$schema: "grimoire-llm-provider-registry/v1"

metadata:
  project: ""
  owner: ""
  policy: "No provider/model call outside this registry."

# Champs optionnels par fournisseur (issue #310, lot 2) — absents par défaut,
# donc un registre v1 sans eux continue de passer verify/gates tel quel :
#   currency    : "quota" (consommé sur un abonnement/CLI) | "api" (facturé à
#                 l'appel) | "local" (calcul local, pas de facturation).
#   invocation  : commande headless pour appeler ce fournisseur hors chat,
#                 avec {prompt} et {model} comme gabarits littéraux ; {prompt}
#                 est obligatoire (providers.invocation_prompt_missing).
#   models      : liste de {id, tier, pricing?}, tier ∈ "cheap" | "mid" |
#                 "strong" — la base sur laquelle `grimoire providers status` /
#                 `choose()` route par palier de coût plutôt que par nom de
#                 modèle.
#   pricing     : tarif catalogue optionnel d'un modèle (issue #1152), en
#                 dollars par million de tokens :
#                   {input_per_mtok: 0.27, output_per_mtok: 1.10,
#                    cache_read_per_mtok: 0.07,
#                    cache_write_5m_per_mtok: 0.3375,
#                    cache_write_1h_per_mtok: 0.54}
#                 `input_per_mtok` et `output_per_mtok` sont requis ; les trois
#                 tarifs de cache (lecture, écriture 5 min, écriture 1 h) sont
#                 facultatifs. `grimoire task show` en chiffre l'usage des
#                 appels repliés depuis le journal de session. Un tarif manquant
#                 — ou une écriture en cache sans répartition par durée — laisse
#                 le coût inconnu, jamais 0. Exemple commenté :
#                   #   - id: "mon-modele"
#                   #     tier: "mid"
#                   #     pricing:
#                   #       input_per_mtok: 0.27
#                   #       output_per_mtok: 1.10
#                   #       cache_read_per_mtok: 0.07
#                   #       cache_write_5m_per_mtok: 0.3375
#                   #       cache_write_1h_per_mtok: 0.54
# Un tier ou une currency hors de ce vocabulaire est une erreur de vérification
# (providers.model_tier_invalid / providers.currency_invalid).

providers:
  - id: "github-copilot"
    enabled: false
    provider_type: "hosted"
    allowed_capabilities: ["chat", "code", "review"]
    default_models: []
    # currency: "quota"
    # models:
    #   - id: "copilot-integrated-models"
    #     tier: "mid"
    data_policy:
      allowed_data_classes: []
      forbidden_data_classes: []
      retention_notes: ""
    fallback_order: []
    audit:
      log_prompts: false
      log_metadata: true

  - id: "openai"
    enabled: false
    provider_type: "hosted"
    allowed_capabilities: ["chat", "code", "reasoning", "embeddings"]
    default_models: []
    data_policy:
      allowed_data_classes: []
      forbidden_data_classes: []
      retention_notes: ""
    fallback_order: []
    audit:
      log_prompts: false
      log_metadata: true

  - id: "anthropic"
    enabled: false
    provider_type: "hosted"
    allowed_capabilities: ["chat", "code", "reasoning"]
    default_models: []
    # currency: "quota"  # abonnement Claude, appelé en CLI headless
    # invocation: "claude -p {prompt} --model {model}"
    # Les alias de la CLI (haiku / sonnet / opus) suivent la dernière version
    # de chaque famille ; un id versionné casse à la première dépréciation
    # (issue #700).
    # models:
    #   - id: "haiku"
    #     tier: "cheap"
    #   - id: "sonnet"
    #     tier: "mid"
    #   - id: "opus"
    #     tier: "strong"
    data_policy:
      allowed_data_classes: []
      forbidden_data_classes: []
      retention_notes: ""
    fallback_order: []
    audit:
      log_prompts: false
      log_metadata: true

  - id: "google-gemini"
    enabled: false
    provider_type: "hosted"
    allowed_capabilities: ["chat", "code", "multimodal", "reasoning"]
    default_models: []
    # currency: "quota"
    # invocation: "gemini -p {prompt} --model {model}"
    # models:
    #   - id: "gemini-2.5-flash"
    #     tier: "cheap"
    #   - id: "gemini-2.5-pro"
    #     tier: "strong"
    data_policy:
      allowed_data_classes: []
      forbidden_data_classes: []
      retention_notes: ""
    fallback_order: []
    audit:
      log_prompts: false
      log_metadata: true

  - id: "local"
    enabled: false
    provider_type: "local"
    allowed_capabilities: ["chat", "code", "embeddings"]
    default_models: []
    # currency: "local"  # calcul local (Ollama), pas de facturation externe
    # {prompt} est obligatoire : sans lui, `ollama run {model}` n'a jamais reçu
    # le prompt et ouvrait une session interactive (issue #700).
    # invocation: "ollama run {model} {prompt}"
    # models:
    #   - id: "qwen3-coder"
    #     tier: "mid"
    data_policy:
      allowed_data_classes: []
      forbidden_data_classes: []
      retention_notes: "Local execution still requires explicit data classification."
    fallback_order: []
    audit:
      log_prompts: false
      log_metadata: true

routing:
  # Classe des données du projet (#1133). Vide : aucun fournisseur hors `provider_type: local` ne reçoit de tâche,
  # sauf si la tâche déclare la sienne (`task add --data-class`). Elle doit figurer dans `allowed_data_classes`
  # du fournisseur, et ne pas figurer dans `forbidden_data_classes`.
  default_data_class: ""
  default_provider: ""
  default_fallback_chain: []
  require_capability_match: true
  require_data_policy_match: true
