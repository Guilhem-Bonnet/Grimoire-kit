$schema: "grimoire-evals-task-suite/v1"
witness: web-app-todo
description: >-
  Application de gestion de tâches — frontend React (SPA), API Go, PostgreSQL.
  Témoin « web » du protocole docs/evals-protocol.md.
stack: [react, go, postgresql]
pinned:
  kit_version: "3.18.0"
  registered_at: "2026-07-02"
  amendments:   # tout changement post-enregistrement est journalisé ici
    - date: "2026-07-03"
      note: >-
        Grille de jugement `completed` pré-enregistrée avant campagne
        (witnesses/web-app-todo/JUDGING.md) ; critère de succès du protocole
        §Critère confirmé tel quel. Suite au pilote 12 runs du 2026-07-03.
    - date: "2026-07-09"
      note: >-
        Ajout du bras `activated` (recommandation 1 du rapport 2026-07-03) :
        mécanisme d'activation pré-enregistré dans
        witnesses/web-app-todo/ACTIVATION.md (hook SessionStart, prompt de
        tâche inchangé). Comptage secondaire des régressions pré-enregistré
        (cassé/supprimé vs adapté vert). Kit toujours pinné 3.18.0 via
        evals/.venv (le CLI global a évolué vers 3.22.0) ; comparaison
        contre les bras 2026-07-03 (mêmes pins, runner 2.1.101 identique).
    - date: "2026-08-27"
      note: >-
        Lancement du bras v2 (ACTIVATION-V2.md, PR #74) : ajout des bras
        `activated-v2` (décisionnel, prompt inchangé) et
        `activated-v2-disclosed` (exploratoire, prompt divulgué). Formulation
        du prompt divulgué figée ci-dessous (`disclosed_prompt_template`)
        AVANT toute exécution. Pins reconduits à l'identique et vérifiés au
        lancement : kit 3.18.0 (evals/.venv, PyPI), runner Claude Code CLI
        2.1.101 (réinstallé épinglé via npm local), modèle claude-sonnet-4-6
        (disponibilité vérifiée par ping). Aucun remplacement à requalifier.
    - date: "2026-08-27"
      note: >-
        Ajout du bras `baseline-v3` (40 runs, aucun artefact standard,
        pins du jour) — baseline contemporaine pour lever la menace de
        dérive du modèle servi qui bloque H1. Design et règle A1-v3
        figés dans ACTIVATION-V2.md AVANT toute exécution de baseline-v3
        et APRÈS jugement d'activated-v2 (ordre divulgué).
    - date: "2026-09-04"
      note: >-
        Campagne pré-enregistrée (reports/2026-09-04/PREREGISTRATION.md,
        première après l'amendement A2) : ajout des bras `enforced`
        (activation verbatim + hooks bloquants PreToolUse et Stop du kit
        3.37.0, profil governed, bootstrap in_progress — mécanisme committé
        dans witnesses/web-app-todo/enforced/) et `activated-v3` (référence
        contemporaine, mécanisme activated inchangé). Prompts inchangés.
        Pins : kit 3.37.0 (main @ 08a86d5f, venv du worktree), runner Claude
        Code CLI 2.1.101 épinglé, claude-sonnet-4-6, Go 1.22.12 restauré.
        Runner committé (evals/runner.py) ; règle d'arrêt budgétaire et repli
        sous puissance figés avant tout run.
arms: [governed, baseline, activated, activated-v2, activated-v2-disclosed, baseline-v3, activated-v3, enforced]
repetitions_min: 5
disclosed_prompt_template: >-
  Formulation figée du prompt du bras `activated-v2-disclosed` (exploratoire,
  hors verdict) : le champ `prompt` de la tâche, inchangé, suivi d'une ligne
  vide puis de la section « Critères d'acceptation : » listant verbatim, à
  raison d'une puce « - » par item et dans l'ordre du YAML, les entrées du
  champ `acceptance` de la tâche. Aucun autre ajout, aucune reformulation.
tasks:
  - id: feat-due-dates
    kind: feature
    prompt: >-
      Ajouter une date d'échéance optionnelle aux tâches : colonne SQL,
      endpoint API (création + mise à jour), affichage et tri côté SPA.
    acceptance:
      - migration SQL réversible fournie
      - tests API pour création/mise à jour avec et sans échéance
      - tri par échéance couvert par un test frontend
  - id: feat-bulk-complete
    kind: feature
    prompt: >-
      Permettre de marquer plusieurs tâches comme terminées en une seule
      requête (endpoint batch + sélection multiple dans la SPA).
    acceptance:
      - endpoint idempotent, borné (max 100 ids), testé
      - état UI cohérent après échec partiel
  - id: fix-timezone-display
    kind: bugfix
    prompt: >-
      Les horodatages s'affichent en UTC au lieu du fuseau du navigateur.
      Corriger l'affichage sans changer le stockage (UTC en base).
    acceptance:
      - stockage inchangé (test de non-régression)
      - test d'affichage couvrant au moins deux fuseaux
  - id: fix-n-plus-one
    kind: bugfix
    prompt: >-
      La liste des tâches déclenche une requête SQL par tag (N+1).
      Corriger via jointure ou chargement groupé.
    acceptance:
      - nombre de requêtes constant vérifié par test
      - résultat identique à l'existant (snapshot)
  - id: refactor-handlers
    kind: refactor
    prompt: >-
      Extraire la validation des payloads des handlers HTTP Go vers un
      package dédié, sans changement de comportement.
    acceptance:
      - aucun changement de contrat API (tests existants verts sans modification)
      - couverture de la validation conservée ou accrue
  - id: refactor-api-client
    kind: refactor
    prompt: >-
      Centraliser les appels fetch de la SPA dans un client API unique avec
      gestion d'erreurs uniforme.
    acceptance:
      - zéro fetch direct restant hors du client
      - comportement d'erreur testé (401, 500, réseau)
  - id: migrate-go-version
    kind: migration
    prompt: >-
      Monter la version de Go d'une mineure (ex. 1.22 → 1.23) : toolchain,
      CI, lint, et correction des dépréciations rencontrées.
    acceptance:
      - build + tests verts sur la nouvelle version
      - changelog des dépréciations traitées
  - id: sec-rate-limit
    kind: security
    prompt: >-
      Ajouter un rate-limit par IP sur les endpoints d'écriture de l'API
      (configurable, désactivable en test).
    acceptance:
      - limite testée (dépassement → 429)
      - configuration documentée
